<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lifeplanner">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Lifeplanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app; scrolling content area above a fixed tab bar; bottom sheets for input. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#101827; --muted:#5A6577; --line:#DCE2EA;
  --accent:#1E56F0; --on-accent:#FFFFFF;
  --c-termin:#1E56F0; --c-gym:#E8571F; --c-essen:#128A5E; --c-aufgabe:#7D45D1;
  --good:#128A5E; --warn:#B57B00; --bad:#D03535;
  --shadow:0 1px 2px rgba(16,24,39,.06),0 6px 20px rgba(16,24,39,.06);
  --font-d:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --font-b:"Manrope",-apple-system,"Segoe UI",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0E15; --surface:#141A24; --surface-2:#1A212D; --ink:#E9EEF6; --muted:#97A3B6; --line:#262F3E;
  --accent:#5C8BFF; --on-accent:#08101F;
  --c-termin:#5C8BFF; --c-gym:#FF7A45; --c-essen:#2FBF88; --c-aufgabe:#A97CF2;
  --good:#2FBF88; --warn:#E3AE3C; --bad:#FF6B6B; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E15; --surface:#141A24; --surface-2:#1A212D; --ink:#E9EEF6; --muted:#97A3B6; --line:#262F3E;
  --accent:#5C8BFF; --on-accent:#08101F;
  --c-termin:#5C8BFF; --c-gym:#FF7A45; --c-essen:#2FBF88; --c-aufgabe:#A97CF2;
  --good:#2FBF88; --warn:#E3AE3C; --bad:#FF6B6B; --shadow:none; color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-d);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.1}
h2{font-size:19px}
h3{font-size:17px}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;display:flex;flex-direction:column}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 96px}
.view{display:flex;flex-direction:column;gap:22px;max-width:640px;margin:0 auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:700;font-size:14px}
.muted{color:var(--muted)}
.small{font-size:13px}

.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn:disabled{opacity:.3}
.icon-row{display:flex;gap:8px}

.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);padding:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;box-shadow:var(--shadow)}
.tile .big{font-family:var(--font-d);font-size:30px;font-weight:700;line-height:1}
.tile .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* timeline items */
.list{display:flex;flex-direction:column;gap:8px}
.item{--c:var(--c-termin);display:grid;grid-template-columns:48px 4px 1fr auto;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left;width:100%}
.item.t-gym{--c:var(--c-gym)} .item.t-essen{--c:var(--c-essen)} .item.t-aufgabe{--c:var(--c-aufgabe)}
.item .time{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.item .bar{align-self:stretch;border-radius:4px;background:var(--c)}
.item .body{min-width:0}
.item .ttl{font-weight:700;overflow-wrap:anywhere}
.item .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item.done .ttl{text-decoration:line-through;color:var(--muted)}
.item.done .bar{opacity:.35}
.pill{border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);white-space:nowrap}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--c);background:transparent;display:grid;place-items:center;padding:0}
.chk svg{width:16px;height:16px;opacity:0}
.done .chk{background:var(--c)} .done .chk svg{opacity:1;color:var(--surface)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent))}
.empty{padding:18px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}

.tip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.tip .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--c-essen)) 15%,transparent);color:var(--c,var(--c-essen))}
.tip .dot svg{width:18px;height:18px}
.tip b{display:block}

.notice{display:flex;gap:10px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:14px;padding:10px 12px;font-size:13px}
.notice button{flex:none}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-weight:700}
.primary{border:0;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:13px 16px;font-weight:700;width:100%}
.danger{color:var(--bad)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row>*{flex:1}

/* rings & bars */
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring .in b{font-family:var(--font-d);font-size:22px}
.ring .in span{font-size:11px;color:var(--muted)}
.macro{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:13px}
.macro .track{grid-column:1/-1}
.track{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.track i{display:block;height:100%;border-radius:8px;background:var(--c,var(--accent))}
.nut{display:flex;gap:16px;align-items:center}
.nut .macros{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}


/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid7 .wd{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em}
.day{border:0;background:transparent;border-radius:12px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-variant-numeric:tabular-nums;font-weight:600}
.day.out{opacity:.35}
.day.today span:first-child{color:var(--accent);font-weight:800}
.day.sel{background:var(--ink);color:var(--bg)}
.day.sel.today span:first-child{color:var(--bg)}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%}
.d-termin{background:var(--c-termin)} .d-gym{background:var(--c-gym)} .d-essen{background:var(--c-essen)} .d-aufgabe{background:var(--c-aufgabe)}

/* gym */
.plan{display:flex;flex-direction:column;gap:10px}
.plan .ex{font-size:13px;color:var(--muted)}
.prog{display:grid;grid-template-columns:1fr 92px auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prog:first-child{border-top:0;padding-top:0}
.prog svg{width:92px;height:30px;overflow:visible}
.delta{font-size:12px;font-weight:700;color:var(--good)}

/* shopping */
.add-bar{display:flex;gap:8px}
.add-bar input{flex:1;min-width:0}
.shop{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line)}
.shop:first-of-type{border-top:0}
.shop .chk{--c:var(--c-essen);flex:none}
.shop.done .chk{background:var(--c)} .shop.done .chk svg{opacity:1;color:var(--surface)}
.shop.done .nm{text-decoration:line-through;color:var(--muted)}
.shop .nm{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.shop .src{display:block;font-size:12px;color:var(--muted);font-weight:500}
.shop .qty{color:var(--muted);font-size:13px;white-space:nowrap}

.sug{flex-wrap:wrap}.sug .nm{flex-basis:100%}.sug .btn{flex:1}
/* forms */
input,select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px}
textarea{min-height:120px;resize:vertical}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
.form label.check{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-weight:600;font-size:14px}
.form label.check input{width:20px;height:20px;flex:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>*{min-width:0}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg label{flex:1;display:block;text-align:center;cursor:pointer;position:relative;color:var(--ink)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:8px 2px;border-radius:9px;font-size:13px;font-weight:700}
.seg input:checked+span{background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.form[data-type="termin"] [data-for]:not([data-for~="termin"]),
.form[data-type="aufgabe"] [data-for]:not([data-for~="aufgabe"]),
.form[data-type="gym"] [data-for]:not([data-for~="gym"]),
.form[data-type="essen"] [data-for]:not([data-for~="essen"]){display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{flex-direction:row}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips span{display:block;padding:7px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.chips input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.food{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.food small{color:var(--muted);display:block}
.food .plus{font-weight:800;color:var(--accent);font-size:20px;line-height:1}

.swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0}
.looks{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:12px;padding:4px 12px}
.lookrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-weight:600;font-size:14px}
.lookrow input{width:46px;height:32px;padding:2px;border-radius:8px;flex:none}
/* tab bar */
nav.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:4px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 6px;font-size:11px;font-weight:700;color:var(--muted)}
nav.tabs svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

#fab{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 2px);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:15;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 45%,transparent)}
#fab svg{width:26px;height:26px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick button{--c:var(--accent);display:flex;align-items:center;gap:10px;text-align:left;padding:14px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-weight:700}
.quick button i{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none}
/* sheet */
#sheet{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
#sheet .backdrop{position:absolute;inset:0;background:rgba(5,10,20,.45)}
#sheet .panel{position:relative;background:var(--surface);border-radius:22px 22px 0 0;max-height:88%;overflow-y:auto;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 14px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.sheet-sec{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.sheet-sec h4{margin:0;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}

/* alarms */
.alarm{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.alarm:first-child{border-top:0}
.alarm .t{font-family:var(--font-d);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.alarm .meta{flex:1;min-width:0}
.alarm.off .t,.alarm.off .meta{opacity:.45}
.switch{width:50px;height:30px;border-radius:30px;border:0;background:var(--line);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* workout session */
#session{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
#session .s-head{padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
#session .s-body{flex:1;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sets{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;align-items:center}
.sets .h{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sets input{padding:9px 10px;text-align:center}
.sets .chk{--c:var(--c-gym);width:40px;height:40px}
.sets .chk.on{background:var(--c)} .sets .chk.on svg{opacity:1;color:var(--surface)}
.rest{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--ink);color:var(--bg);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.rest b{font-family:var(--font-d);font-size:26px;font-variant-numeric:tabular-nums;flex:1}
.rest button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:10px;padding:8px 12px;font-weight:700}

/* ringing alarm + toast */
#ring{position:fixed;inset:0;z-index:50;background:var(--accent);color:var(--on-accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#ring .t{font-family:var(--font-d);font-size:72px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
#ring button{border:2px solid currentColor;background:transparent;color:inherit;border-radius:14px;padding:14px 22px;font-weight:800;min-width:220px}
#ring button.solid{background:var(--on-accent);color:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Einsteiger: Einrichtung, Heute zu tun, Wissen, Anleitungen */
#onb{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
#onb .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:100%}
.steps{display:flex;gap:6px}.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}.steps i.on{background:var(--accent)}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px}
.opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.opt b{display:block;margin-bottom:3px}
.rec{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--on-accent);background:var(--accent);border-radius:6px;padding:2px 6px;margin-left:8px;vertical-align:2px}
.bullets{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.steps-ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:7px}
.fokus-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.todo{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.todo:first-of-type{border-top:0}
.todo .tx{flex:1;min-width:0}
.todo .tx b{display:block;overflow-wrap:anywhere}
.todo .tx .small{display:block}
.todo .track{margin-top:6px;height:6px}
.todo.ok .tx b{color:var(--muted);text-decoration:line-through}
.state{width:28px;height:28px;border-radius:50%;border:2px solid var(--c,var(--accent));display:grid;place-items:center;flex:none;background:transparent;padding:0}
.state svg{width:15px;height:15px;opacity:0}
.todo.ok .state{background:var(--c,var(--accent))}.todo.ok .state svg{opacity:1;color:var(--surface)}
.todo.info .state{border-style:dashed;opacity:.6}
details.k{border-top:1px solid var(--line);padding:12px 0}
details.k:first-of-type{border-top:0}
details.k summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.k summary::after{content:"+";color:var(--accent);font-weight:800;font-size:18px;line-height:1}
details.k[open] summary::after{content:"\2013"}
details.k summary::-webkit-details-marker{display:none}
details.k .kb{margin-top:8px;display:flex;flex-direction:column;gap:8px;font-size:14px}

function targets(date){
  const p=S.profile,bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==="w"?-161:5);
  let kcal=bmr*p.act;const train=isTrainingDay(date);
  if(train)kcal+=250;
  const ph=phaseOn(date),goal=ph?ph.goal:p.goal,pick=k=>ph&&ph[k]!=null?ph[k]:p[k];const sur=pick("surplus"),pkg=pick("pkg"),fkg=pick("fkg");
  kcal+=sur!=null&&sur!==""?+sur:(goal==="aufbau"?300:goal==="abnehmen"?-450:0);
  const P=p.weight*(+pkg||(goal==="halten"?1.6:goal==="abnehmen"?2.0:1.9));
  const F=p.weight*(+fkg||0.9);const C=Math.max(0,(kcal-P*4-F*9)/4);
  return {kcal,P,C,F,train,phase:ph};
}

function weightTrend(){
  const w=(S.weights||[]).slice().sort((a,b)=>a.date<b.date?-1:1);if(w.length<2)return null;
  const last=w[w.length-1].date,avg=(from,to)=>{const x=w.filter(z=>z.date>from&&z.date<=to);return x.length?x.reduce((a,z)=>a+z.kg,0)/x.length:null};
  const a1=avg(iso(addDays(parseIso(last),-7)),last),a0=avg(iso(addDays(parseIso(last),-14)),iso(addDays(parseIso(last),-7)));
  const span=(parseIso(last)-parseIso(w[0].date))/864e5;
  if(a0==null||span<10)return {now:a1,perWeek:null};
  return {now:a1,perWeek:a1-a0};
}

    out.push({c:"var(--c-essen)",i:I.leaf,t:"Noch "+fmt(missP)+" g Protein offen",d:missP>45?"Zum Beispiel 250 g Magerquark (30 g) und eine Hähnchenbrust (35 g).":"Ein Skyr (16 g) und ein Proteinshake (24 g) reichen dafür."});
  }else if(e.kcal>0){
    out.push({c:"var(--c-essen)",i:I.leaf,t:"Proteinziel fast erreicht",d:"Gut gemacht. Achte beim Rest des Tages auf Gemüse und genug Wasser."});
  }

  const nx=nextPhase(date);if(nx&&date===todayIso()){const dd=Math.round((parseIso(nx.from)-parseIso(date))/864e5);if(dd<=14)out.push({c:"var(--warn)",i:I.leaf,t:"In "+dd+" Tagen: "+nx.name,d:nx.goal==="abnehmen"?"Dann stellt die App auf ein Defizit von 500 kcal um, Protein steigt auf 2,3 g pro kg. Training bleibt schwer, damit die Muskeln bleiben.":"Dann gehen die Kalorien auf Erhalt hoch. Fahr sie über 2 Wochen langsam an."})}
  if(goalOn(date)==="abnehmen"&&date===todayIso()){const tr=weightTrend();
    out.push({c:"var(--c-essen)",i:I.leaf,t:"Diät: satt bleiben",d:"Viel Volumen: Gemüse, Kartoffeln, mageres Fleisch, Skyr. Shake mit Wasser statt Vollmilch, Erdnussbutter weglassen."});
    if(tr&&tr.perWeek!=null){if(tr.perWeek>-0.3)out.push({c:"var(--warn)",i:I.leaf,t:"Gewicht sinkt kaum",d:"Ziel sind 0,4 bis 0,8 kg pro Woche. Nimm 150 kcal weniger oder mach täglich 3.000 Schritte mehr."});
      else if(tr.perWeek<-1)out.push({c:"var(--warn)",i:I.leaf,t:"Zu schneller Verlust",d:"Mehr als 1 kg pro Woche kostet Muskeln. Iss 150 bis 200 kcal mehr."});
      else out.push({c:"var(--c-essen)",i:I.leaf,t:"Diät im Plan",d:tr.perWeek.toLocaleString("de-DE",{maximumFractionDigits:2})+" kg pro Woche. Genau richtig."})}}
  if(goalOn(date)==="aufbau"&&date===todayIso()){
    if(h<14)out.push({c:"var(--c-essen)",i:I.leaf,t:"Mittag bestellen",d:"Nimm etwas mit viel Fleisch oder Fisch plus Reis, Nudeln oder Brot, z. B. Bowl, Döner, Curry mit Reis, Pasta mit Hähnchen. Extra Fleisch dazubestellen lohnt sich. Ziel: etwa 800 kcal und 40 g Protein."});

function nextAlarm(){
  const now=new Date();let best=null;
  for(const a of S.alarms){if(!a.on)continue;
    for(let i=0;i<8;i++){const d=addDays(now,i);if(!a.days.includes(d.getDay()))continue;
      const [hh,mm]=a.time.split(":").map(Number);const at=new Date(d.getFullYear(),d.getMonth(),d.getDate(),hh,mm);
      if(at>now){if(!best||at<best.at)best={at,a};break}}}
  return best;
}
function bestOf(name){let best=null;
  for(const l of S.logs)for(const x of l.ex)if(x.n===name)for(const z of x.sets){if(!best||z.w>best.w||(z.w===best.w&&z.r>best.r))best={w:z.w,r:z.r,date:l.date}}
  return best}
function lastSets(name){
  for(let i=S.logs.length-1;i>=0;i--){const x=S.logs[i].ex.find(e=>e.n===name);if(x&&x.sets.length)return x.sets}
  return null;
}
function addIngredients(r){
  let n=0;
  for(const g of r.ing){
    if(S.shopping.some(s=>!s.done&&s.n.toLowerCase()===g.n.toLowerCase()))continue;
    S.shopping.push({id:uid(),n:g.n,m:g.m,cat:guessCat(g.n),src:r.name});n++;
  }
  return n;
}

function proteinSuggestions(date){
  const tg=targets(date),e=eaten(date),miss=tg.P-e.P,kcalLeft=tg.kcal-e.kcal;
  if(miss<15)return [];
  const out=[];
  for(const r of S.recipes)if(r.P>=30&&r.kcal<=kcalLeft+150)out.push({kind:"r",id:r.id,name:r.name,amount:"1 Portion",P:r.P,kcal:r.kcal});
  for(const n of PROTEIN_PICKS){const f=FOOD100.find(x=>x.n===n);if(!f)continue;const v=foodCalc(f,f.por);if(v.P>=15)out.push({kind:"f",i:FOOD100.indexOf(f),name:f.n,amount:f.por+" g",P:Math.round(v.P),kcal:Math.round(v.kcal)})}
  const ok=out.filter(x=>x.kcal<=Math.max(250,kcalLeft)).sort((a,b)=>b.P/b.kcal-a.P/a.kcal);
  return ok.filter(x=>x.kind==="r").slice(0,1).concat(ok.filter(x=>x.kind==="f").slice(0,3));
}

  else if(e.type==="essen"){const r=recipeById(e.recipe);sub=r?fmt(r.kcal)+" kcal · "+r.P+" g Protein":"";
    act=e.done?'<span class="badge" style="--c:var(--c-essen)">Gegessen</span>':`<button class="pill" data-act="eatEvent" data-id="${e.id}">Gegessen</button>`}
  else{sub=e.type==="termin"?(e.reminder?"Erinnerung "+e.reminder+" Min. vorher":"Termin"):"Aufgabe";
    act=`<button class="chk" data-act="toggle" data-id="${e.id}" aria-label="Erledigt">${I.check}</button>`}
  if(e.rep)sub="↻ "+(REPS.find(r=>r[0]===e.rep)||["",""])[1]+(sub?" · "+sub:"");
  return `<div class="item t-${e.type}${e.done?" done":""}" data-act="detail" data-id="${e.id}" role="button" tabindex="0">
    <div class="time">${e.time||"–"}</div><div class="bar"></div>
    <div class="body"><div class="ttl">${esc(evTitle(e))}</div><div class="sub">${esc(sub)}</div></div>${act}</div>`;
}
function ring(val,max,label,color){
  const r=42,c=2*Math.PI*r,p=Math.min(1,max?val/max:0);
  return `<div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="10"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*p} ${c}"/></svg><div class="in"><div><b class="num">${fmt(val)}</b><br><span>${label}</span></div></div></div>`;
}
function macroBar(name,v,t,c){
  return `<div class="macro"><span>${name}</span><span class="num muted">${fmt(v)} / ${fmt(t)} g</span><div class="track" style="--c:${c}"><i style="width:${Math.min(100,t?v/t*100:0)}%"></i></div></div>`;
}
function tipList(arr){return arr.map(t=>`<div class="tip" style="--c:${t.c}"><div class="dot">${t.i}</div><div><b>${esc(t.t)}</b><span class="muted small">${esc(t.d)}</span></div></div>`).join("")}
function spark(vals){
  const w=92,h=30,mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*w,h-3-(v-mn)/rg*(h-6)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const l=pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d} L${w} ${h} L0 ${h}Z" fill="color-mix(in srgb,var(--c-gym) 14%,transparent)"/><path d="${d}" fill="none" stroke="var(--c-gym)" stroke-width="2" stroke-linejoin="round"/><circle cx="${l[0]}" cy="${l[1]}" r="3" fill="var(--c-gym)"/></svg>`;
}

const DEFAULT_WIDGETS=[["fokus",1],["tag",1],["tipp",1],["woche",1],["einkauf",1],["wecker",0],["kalorien",0],["training",0],["wasser",0],["aufgaben",0]];
function widgetList(){
  let w=Array.isArray(S.widgets)?S.widgets.filter(x=>WIDGETS[x[0]]):[];
  for(const d of DEFAULT_WIDGETS)if(!w.some(x=>x[0]===d[0]))w.push([d[0],0]);

function renderWidgets(){

const norm=x=>x.toLowerCase().replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss");
function foodResults(q){
  q=norm(q.trim());
  const rec=S.recipes.filter(r=>!q||norm(r.name).includes(q));
  const recent=[];for(let k=S.meals.length-1;k>=0&&recent.length<5;k--){const m=S.meals[k];if(m.food&&!recent.includes(m.food))recent.push(m.food)}
  const foods=FOOD100.map((f,i)=>({f,i})).filter(({f})=>!q||norm(f.n).includes(q));
  if(!q)foods.sort((a,b)=>(recent.includes(b.f.n)?1:0)-(recent.includes(a.f.n)?1:0));
  const fb=({f,i})=>`<button class="food" data-act="pickFood" data-i="${i}"><span><b>${esc(f.n)}</b><small class="num">${f.kcal} kcal · ${f.P.toLocaleString("de-DE")} g Protein je 100 g${recent.includes(f.n)?" · zuletzt gegessen":""}</small></span><span class="plus">+</span></button>`;
  return (rec.length?`<h4>Rezepte</h4>${rec.map(r=>`<button class="food" data-act="addRecipeMeal" data-id="${r.id}"><span><b>${esc(r.name)}</b><small class="num">${r.kcal} kcal · ${r.P} g Protein · 1 Portion</small></span><span class="plus">+</span></button>`).join("")}`:"")
   +`<h4>Lebensmittel</h4>${foods.length?foods.slice(0,q?40:14).map(fb).join(""):`<p class="small muted">Nichts gefunden. Trag es unten als eigene Mahlzeit ein.</p>`}`;
}

const EX={
  "Kniebeugen":{m:"Oberschenkel, Po, Rumpf",s:["Stange auf den oberen Rücken legen (nicht auf den Nacken). Füße schulterbreit, Zehen leicht nach außen.","Tief einatmen und den Bauch fest anspannen.","Hüfte nach hinten und unten, die Knie zeigen in Richtung Zehen. So tief, wie der Rücken gerade bleibt (Ziel: Oberschenkel waagerecht).","Über die ganze Fußsohle kraftvoll hochdrücken, oben ausatmen."],f:"Knie fallen nach innen oder die Fersen heben ab. Dann lieber weniger Gewicht.",e:"Leichter: Goblet Squat mit einer Kurzhantel.",r:150},
  "Bankdrücken":{m:"Brust, vordere Schulter, Trizeps",s:["Auf die Bank legen, Augen unter der Stange, Füße fest am Boden.","Schulterblätter zusammen und nach unten ziehen. Griff etwas breiter als schulterbreit.","Stange langsam zur unteren Brust senken, Ellbogen etwa 45° vom Körper.","Kraftvoll nach oben drücken."],f:"Ellbogen weit zur Seite oder der Po hebt von der Bank ab. Bei schweren Sätzen jemanden zum Sichern fragen.",e:"Leichter: mit Kurzhanteln.",r:150},
  "Latziehen":{m:"Breiter Rücken, Bizeps",s:["Oberschenkel unter das Polster klemmen, Stange etwas breiter als schulterbreit greifen.","Brust raus, leicht nach hinten lehnen.","Stange zur oberen Brust ziehen, Ellbogen nach unten Richtung Hüfte führen.","Langsam wieder hoch, bis die Arme gestreckt sind."],f:"Mit Schwung aus dem Oberkörper reißen oder die Stange in den Nacken ziehen.",e:"Gute Vorstufe für Klimmzüge.",r:120},
  "Rumänisches Kreuzheben":{m:"Hintere Oberschenkel, Po, unterer Rücken",s:["Aufrecht stehen, Gewicht (Stange oder Kurzhanteln) vor den Oberschenkeln, Knie leicht gebeugt.","Hüfte weit nach hinten schieben. Der Rücken bleibt gerade, das Gewicht gleitet nah an den Beinen nach unten.","So weit runter, bis du hinten im Oberschenkel eine starke Dehnung spürst (meist knapp unter dem Knie).","Hüfte nach vorne bringen und aufrichten, oben den Po anspannen."],f:"Runder Rücken. Brust raus, Blick leicht schräg nach unten.",e:"Leichter: weniger Gewicht oder nur bis zum Knie.",r:120},
  "Seitheben":{m:"Seitliche Schulter (macht breite Schultern)",s:["Aufrecht stehen, Kurzhanteln seitlich, Ellbogen minimal gebeugt.","Arme seitlich bis auf Schulterhöhe anheben.","Kurz halten und langsam (2 Sekunden) absenken."],f:"Zu schwer und mit Schwung. Hier gilt: leicht und sauber, das Brennen ist gewollt.",e:"",r:75},
  "Plank":{m:"Bauch und Rumpf",s:["Unterarme auf den Boden, Ellbogen unter den Schultern.","Beine gestreckt, auf den Zehenspitzen. Der Körper bildet eine gerade Linie vom Kopf bis zu den Fersen.","Bauch und Po fest anspannen, ruhig weiteratmen.","Halten. In der App trägst du Sekunden statt Wiederholungen ein."],f:"Die Hüfte hängt durch oder der Po ragt nach oben.",e:"Leichter: auf den Knien. Schwerer: ein Bein anheben.",r:60},
  "Hängendes Knieheben":{m:"Unterer Bauch, Hüftbeuger",s:["An die Klimmzugstange hängen, Arme gestreckt, Schultern aktiv nach unten ziehen.","Knie kontrolliert Richtung Brust ziehen und dabei das Becken leicht einrollen.","Langsam wieder absenken, ohne zu schwingen."],f:"Schwingen. Wenn du ins Pendeln kommst: kurz stoppen, dann ruhig weiter.",e:"Leichter: Knieheben im Liegen auf der Bank. Schwerer: mit gestreckten Beinen.",r:60},
  "Beinpresse":{m:"Oberschenkel, Po",s:["Rücken und Po fest an die Lehne, Füße schulterbreit mittig auf die Platte.","Sicherung lösen, Platte langsam absenken, bis die Knie etwa 90° gebeugt sind.","Über die ganze Fußsohle wegdrücken. Die Knie oben nicht ganz durchstrecken."],f:"Der Po hebt sich unten von der Lehne oder die Knie fallen nach innen.",e:"",r:120},
  "Schrägbankdrücken":{m:"Obere Brust, Schulter, Trizeps",s:["Bank auf etwa 30° stellen, mit den Kurzhanteln auf den Oberschenkeln hinsetzen.","Hinlegen und die Hanteln auf Schulterhöhe bringen, Schulterblätter zusammen.","Hanteln nach oben drücken und oben fast zusammenführen.","Langsam absenken, bis du die Brust dehnst."],f:"Bank zu steil, dann arbeitet vor allem die Schulter.",e:"",r:120},
  "Rudern am Kabel":{m:"Mittlerer Rücken, Lat, Bizeps",s:["Aufrecht hinsetzen, Füße an die Platte, Knie leicht gebeugt.","Griff zum Bauch ziehen, Ellbogen eng am Körper nach hinten.","Schulterblätter zusammendrücken und kurz halten.","Langsam nach vorne lassen, bis die Arme gestreckt sind."],f:"Mit dem ganzen Oberkörper vor und zurück schaukeln.",e:"",r:120},
  "Schulterdrücken":{m:"Schultern, Trizeps",s:["Auf die Bank (Lehne senkrecht) setzen oder stehen. Hanteln auf Schulterhöhe, Handflächen nach vorne.","Bauch fest, kein Hohlkreuz.","Hanteln nach oben drücken, bis die Arme fast gestreckt sind.","Langsam zurück auf Schulterhöhe."],f:"Starkes Hohlkreuz. Dann ist das Gewicht zu schwer.",e:"",r:120},
  "Beinbeuger":{m:"Hintere Oberschenkel",s:["Maschine so einstellen, dass das Knie auf Höhe der Drehachse ist. Das Polster liegt über der Ferse.","Fersen Richtung Po ziehen und kurz halten.","Langsam zurück."],f:"Die Hüfte hebt sich vom Polster.",e:"",r:90},
  "Bizepscurls":{m:"Bizeps",s:["Aufrecht stehen, Kurzhanteln seitlich, Handflächen nach vorne.","Die Ellbogen bleiben am Körper. Hanteln zur Schulter beugen.","Oben kurz anspannen, dann langsam (2 Sekunden) absenken."],f:"Schwung aus dem Rücken holen.",e:"",r:75},
  "Hammercurls":{m:"Bizeps, Unterarm",s:["Wie Bizepscurls, aber die Handflächen zeigen zueinander (als würdest du einen Hammer halten).","Ellbogen am Körper, hoch zur Schulter, langsam wieder runter."],f:"Die Ellbogen wandern nach vorne.",e:"",r:75},
  "Trizepsdrücken am Kabel":{m:"Trizeps (Rückseite des Oberarms)",s:["Vor den Kabelzug stellen, Seil oder Stange oben greifen.","Ellbogen eng am Körper festhalten.","Unterarme nach unten strecken, bis die Arme gerade sind, kurz anspannen.","Langsam zurück bis etwa 90°."],f:"Die Ellbogen gehen mit nach vorne und oben.",e:"",r:75},
  "Kabel-Crunch":{m:"Gerader Bauch (Sixpack)",s:["Vor dem Kabelzug knien, Seil oben befestigt, die Enden neben dem Kopf halten.","Die Hüfte bleibt ruhig. Oberkörper einrollen: Brust Richtung Knie, Rücken rund.","Bauch fest zusammenziehen und ausatmen.","Langsam wieder aufrollen."],f:"Mit den Armen ziehen oder aus der Hüfte beugen. Die Bewegung kommt nur aus dem Bauch.",e:"Bauchmuskeln wachsen wie andere Muskeln mit Gewicht. Steigere es wie bei den anderen Übungen.",r:60},
  "Wadenheben":{m:"Waden",s:["Mit den Fußballen auf eine Stufe, die Fersen hängen frei.","Ganz hoch auf die Zehenspitzen, 1 Sekunde halten.","Langsam tief absenken, bis du die Wade dehnst."],f:"Zu schnell und federnd, ohne volle Bewegung.",e:"",r:75},
  "Klimmzüge":{m:"Breiter Rücken, Bizeps",s:["Stange etwas breiter als schulterbreit greifen, Handflächen von dir weg.","Schultern nach unten ziehen, Körper ruhig halten.","Hochziehen, bis das Kinn über der Stange ist. Kontrolliert ganz runter.","Schaffst du noch keinen: Negative. Mit Stuhl oder Sprung oben starten und dich 3 bis 5 Sekunden lang langsam herunterlassen. Jede Negative zählt als 1 Wiederholung."],f:"Halbe Wiederholungen oder Schwung aus den Beinen.",e:"Leichter: Negative oder mit Widerstandsband.",r:150},
  "Einarmiges Rudern":{m:"Rücken, Bizeps",s:["Eine Hand und ein Knie auf die Bank, Rücken gerade wie ein Tisch.","Die Kurzhantel mit der freien Hand hängen lassen.","Hantel zur Hüfte ziehen, Ellbogen eng am Körper.","Langsam absenken. Erst alle Wiederholungen mit einer Seite, dann die andere. Du trägst die Zahl pro Seite ein."],f:"Der Oberkörper dreht mit auf.",e:"",r:90},
  "Liegestütze":{m:"Brust, Schulter, Trizeps, Rumpf",s:["Griffe etwas breiter als schulterbreit, der Körper bildet eine gerade Linie.","Bauch und Po anspannen.","Brust bis knapp über den Boden senken, Ellbogen etwa 45° vom Körper.","Kraftvoll hochdrücken."],f:"Die Hüfte hängt durch.",e:"Leichter: Hände auf die Bank. Schwerer: Füße auf die Bank oder 3 Sekunden langsam runter.",r:90},
  "Liegestütze eng":{m:"Trizeps, Brust",s:["Wie Liegestütze, aber die Griffe nur schulterbreit.","Ellbogen eng am Körper nach hinten führen.","Runter und hoch, der Körper bleibt gerade."],f:"Die Ellbogen gehen nach außen.",e:"Leichter: auf den Knien.",r:75},
  "Bulgarian Split Squat":{m:"Oberschenkel, Po, Gleichgewicht",s:["Mit dem Rücken zur Bank stellen und einen Fuß mit dem Spann hinten auf die Bank legen.","Der vordere Fuß steht etwa einen großen Schritt vor der Bank, Kurzhanteln seitlich.","Gerade nach unten sinken, bis das hintere Knie fast den Boden berührt.","Über die vordere Ferse hochdrücken. Erst alle Wiederholungen mit einem Bein, dann das andere."],f:"Der vordere Fuß steht zu nah an der Bank, dann hebt die Ferse ab.",e:"Leichter: ohne Hanteln.",r:90},
  "Beinstrecker":{m:"Vordere Oberschenkel",s:["Maschine einstellen: Knie auf Höhe der Drehachse, das Polster vorne über dem Knöchel.","Beine strecken und oben 1 Sekunde halten.","Langsam zurück."],f:"Mit Schwung arbeiten.",e:"",r:75},
  "Sit-ups auf der Bank":{m:"Gerader Bauch",s:["Füße unter den Polstern einhaken, Hände an die Schläfen (nicht am Nacken ziehen).","Oberkörper einrollen: erst Kopf, dann Schultern, dann unterer Rücken.","Hoch bis kurz vor senkrecht, dann langsam zurück abrollen."],f:"Am Kopf ziehen oder sich mit Schwung hochwerfen.",e:"Schwerer: Bank steiler stellen oder eine Hantel vor die Brust nehmen.",r:60},
  "Russian Twist":{m:"Seitliche Bauchmuskeln",s:["Auf den Boden setzen, Knie gebeugt, Oberkörper leicht nach hinten lehnen, Rücken gerade.","Kurzhantel mit beiden Händen vor der Brust halten.","Oberkörper nach links drehen, dann nach rechts. Links und rechts zählen zusammen als 1 Wiederholung pro Seite."],f:"Nur die Arme bewegen, statt den Oberkörper zu drehen.",e:"Leichter: Füße am Boden. Schwerer: Füße anheben.",r:60},
  "Goblet Squat":{m:"Oberschenkel, Po, Rumpf",s:["Eine Kurzhantel senkrecht vor der Brust halten, wie einen Kelch.","Füße etwas breiter als schulterbreit, Zehen leicht nach außen.","Tief in die Hocke setzen, Oberkörper aufrecht, Ellbogen zwischen die Knie.","Über die ganze Fußsohle hochdrücken."],f:"Die Fersen heben ab oder der Rücken wird rund.",e:"",r:120},
  "Bodendrücken":{m:"Brust, Trizeps",s:["Auf den Rücken legen, Knie angewinkelt, Kurzhanteln über der Brust.","Hanteln absenken, bis die Oberarme den Boden berühren (Ellbogen etwa 45°).","Kurz ablegen, dann kraftvoll hochdrücken."],f:"Die Ellbogen auf den Boden fallen lassen.",e:"Mit Bank: Kurzhantel-Bankdrücken auf der Bank, dann geht die Bewegung tiefer.",r:120},
  "Seitstütz":{m:"Seitliche Bauchmuskeln",s:["Auf die Seite legen, Ellbogen unter der Schulter.","Hüfte anheben, bis der Körper eine gerade Linie bildet.","Halten, dann die Seite wechseln. Du trägst die Sekunden pro Seite ein."],f:"Die Hüfte sinkt ab.",e:"Leichter: das untere Knie bleibt am Boden.",r:45},
  "Dips":{m:"Brust, Trizeps",s:["An den Barren stützen, Arme gestreckt.","Langsam absenken, bis die Oberarme etwa waagerecht sind, Oberkörper leicht nach vorne.","Hochdrücken."],f:"Zu tief runter, wenn es in der Schulter zieht.",e:"",r:120},
  "Langhantelrudern":{m:"Rücken, Bizeps",s:["Hüfte nach hinten, Oberkörper etwa 45° nach vorne, Rücken gerade.","Stange zum Bauchnabel ziehen.","Langsam absenken."],f:"Runder Rücken oder Schwung.",e:"",r:120}
};
const exBase=n=>String(n).replace(/\s*\(.*\)\s*$/,"").trim();
const exInfo=n=>EX[n]||EX[exBase(n)]||null;
const isTimeEx=n=>/sekunden/i.test(n);
const restFor=n=>(exInfo(n)||{}).r||90;
const restTxt=s=>s>=120?(s/60).toLocaleString("de-DE")+" Min.":s>60?"1:"+pad(s-60)+" Min.":s+" Sek.";

/* ---------- Wissen (Ernährungswissenschaft + Training, einfach erklärt) ---------- */
function kcalExplain(){
  const p=S.profile,t=todayIso(),bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==="w"?-161:5),base=bmr*p.act;
  const tg=targets(t),rest=tg.train?tg.kcal-250:tg.kcal,sur=Math.round(rest-base),ph=tg.phase;
  return `<p>So rechnet die App, mit deinen Daten (${fmt(p.height)} cm, ${p.weight.toLocaleString("de-DE")} kg, ${p.age} Jahre):</p>
  <div class="card" style="padding:10px 12px;box-shadow:none">
   <div class="shop"><span class="nm">Grundumsatz<span class="src">Was dein Körper im Liegen verbraucht</span></span><span class="num">${fmt(bmr)} kcal</span></div>
   <div class="shop"><span class="nm">Plus Alltag<span class="src">Arbeit, Wege, Bewegung (Faktor ${String(p.act).replace(".",",")})</span></span><span class="num">${fmt(base)} kcal</span></div>
   <div class="shop"><span class="nm">${sur>=0?"Plus Überschuss":"Minus Defizit"}<span class="src">${ph?"Phase "+esc(ph.name):"Dein Ziel"}</span></span><span class="num">${sur>=0?"+":"−"}${fmt(Math.abs(sur))} kcal</span></div>
   <div class="shop"><span class="nm"><b>Ruhetag</b></span><span class="num"><b>${fmt(rest)} kcal</b></span></div>
   <div class="shop"><span class="nm"><b>Trainingstag</b><span class="src">+250 kcal fürs Training</span></span><span class="num"><b>${fmt(rest+250)} kcal</b></span></div>
  </div>
  <p>Protein: ${p.weight.toLocaleString("de-DE")} kg × ${(tg.P/p.weight).toLocaleString("de-DE",{maximumFractionDigits:1})} g = <b>${fmt(tg.P)} g</b> am Tag. Wenn du dich wiegst, rechnet die App automatisch mit deinem neuen Gewicht.</p>
  <p class="small muted">Das ist eine gute Schätzung, keine exakte Messung. Ob sie passt, zeigt dein Gewichtstrend nach 2 bis 3 Wochen. Die App sagt dir dann, ob du mehr oder weniger essen solltest.</p>`;
}
const KNOW={
 e:{t:"Ernährung einfach erklärt",d:"Das Wichtigste, ohne Fachchinesisch. Tippe auf eine Frage.",items:[
  ["Warum soll ich so viel essen?",`<p>Muskeln wachsen nur, wenn dein Körper genug Baumaterial <b>und</b> genug Energie hat. Isst du nur so viel, wie du verbrauchst, baust du als schlanker Anfänger kaum Masse auf.</p><p>Deshalb isst du in der Aufbauphase jeden Tag etwas mehr, als du verbrauchst (Überschuss). Gut ist eine Zunahme von <b>0,3 bis 0,6 kg pro Woche</b>. Ein Teil davon ist Fett. Das ist normal und geht in der Diätphase im Mai wieder weg.</p>`],
  ["Wie kommt meine Kalorienzahl zustande?",kcalExplain],
  ["Was sind Kalorien und Makros?",`<p><b>Kalorien (kcal)</b> sind die Energie im Essen. Sie entscheiden, ob du zunimmst oder abnimmst.</p><p><b>Makros</b> sind die drei Bausteine, aus denen die Kalorien kommen:</p><ul class="bullets"><li><b>Protein (Eiweiß):</b> Baumaterial für Muskeln. 1 g = 4 kcal.</li><li><b>Kohlenhydrate:</b> Treibstoff fürs Training. Reis, Nudeln, Brot, Haferflocken, Kartoffeln, Obst. 1 g = 4 kcal.</li><li><b>Fett:</b> wichtig für Hormone. Nüsse, Öl, Erdnussbutter, Käse. 1 g = 9 kcal, also sehr energiereich.</li></ul><p>Für dich gilt: <b>Erst Kalorien schaffen, dann Protein.</b> Kohlenhydrate und Fett darfst du frei verteilen.</p>`],
  ["Warum so viel Protein?",`<p>Beim Training entstehen kleine Reize im Muskel. Zum Reparieren und Wachsen braucht der Körper Protein. Mit etwa <b>2 g pro kg Körpergewicht</b> bist du auf der sicheren Seite. Mehr bringt kaum etwas.</p><p><b>Trick:</b> Verteile es auf 4 bis 5 Portionen mit je 30 bis 40 g. Proteinquellen ohne Kochen:</p><ul class="bullets"><li>250 g Magerquark: 30 g</li><li>Whey-Shake (30 g Pulver): 23 g, mit Milch 31 g</li><li>150 g Hähnchen, vorgegart: 35 g</li><li>1 Dose Thunfisch: 30 g</li><li>200 g Hüttenkäse: 24 g</li><li>0,5 l Milch: 17 g</li></ul>`],
  ["Ich habe keinen Hunger. Was tun?",`<ul class="bullets"><li><b>Trinken statt kauen:</b> Shakes und Vollmilch machen weniger satt als feste Nahrung. Dein Masse-Shake hat über 1.000 kcal.</li><li><b>Kleine, energiereiche Sachen:</b> Nüsse, Erdnussbutter, Käse, ein Schuss Olivenöl über Reis oder Nudeln (1 EL = 90 kcal, schmeckt man kaum).</li><li><b>Nach der Uhr essen,</b> nicht nach Hunger. Lieber 4 bis 5 kleinere Mahlzeiten als 2 große.</li><li><b>Mittags groß bestellen,</b> wenn Essen sowieso kommt: Extra-Fleisch oder Beilage dazu.</li><li><b>Snacks griffbereit</b> hinlegen: Nüsse auf dem Schreibtisch, Proteinriegel in der Tasche.</li><li>Salat und Rohkost erst am Ende essen, sie machen schnell satt.</li></ul>`],
  ["Was bestelle ich mittags?",`<p>Faustregel: <b>eine große Portion Fleisch oder Fisch plus eine große Beilage</b> (Reis, Nudeln, Brot, Kartoffeln).</p><ul class="bullets"><li><b>Gut:</b> Bowl mit Reis und Hähnchen oder Rind, Curry mit Reis, Döner oder Dürüm, Pasta mit Hähnchen oder Bolognese, Burger mit extra Patty, Schnitzel mit Pommes.</li><li><b>Zu wenig für dich:</b> nur Salat, nur Suppe, nur ein Brötchen.</li></ul><p>In der App: unter <b>Essen</b> auf „Mittag bestellt“ tippen. Das ist eine Schätzung, das reicht völlig.</p>`],
  ["Muss ich alles genau abwiegen?",`<p>Nein. Schätzen reicht. Wichtig ist, dass du <b>jeden Tag ungefähr</b> auf dein Ziel kommst. Ob es passt, zeigt das Körpergewicht nach ein paar Wochen.</p><p>Nutze die Schnell-Knöpfe unter <b>Essen</b>. Für die meisten Tage sind das 3 bis 4 Tipper.</p>`],
  ["Richtig wiegen",`<ul class="bullets"><li>Morgens, nach der Toilette, vor dem Frühstück.</li><li>2 bis 3 Mal pro Woche (die App erinnert Mo, Mi, Fr).</li><li>Schwankungen von 1 kg von Tag zu Tag sind normal (Wasser, Salz, Verdauung). Die App schaut nur auf den <b>Trend</b> über 2 Wochen.</li></ul>`],
  ["Aufbau, Diät, Erhalt: Was passiert wann?",`<ul class="bullets"><li><b>Aufbau bis 16.5.2027:</b> Überschuss, Muskeln und etwas Fett kommen dazu.</li><li><b>Diät 17.5. bis 25.7.2027:</b> 500 kcal weniger am Tag, mehr Protein, Training bleibt schwer. Das Fett geht, die Muskeln bleiben. Erst jetzt wird das Sixpack sichtbar.</li><li><b>Erhalt ab 26.7.2027:</b> so viel essen, wie du verbrauchst.</li></ul><p>Die App stellt die Ziele an diesen Tagen automatisch um und erinnert dich vorher.</p>`],
  ["Brauche ich Nahrungsergänzung?",`<p>Nötig ist nichts. Sinnvoll und gut erforscht sind zwei Dinge:</p><ul class="bullets"><li><b>Whey-Protein:</b> einfach Milcheiweiß als Pulver. Praktisch, weil du schwer isst.</li><li><b>Kreatin-Monohydrat (optional):</b> 3 bis 5 g täglich, egal wann, mit Wasser. Bringt etwas mehr Kraft und Muskelzuwachs. Am Anfang 1 bis 2 kg mehr Wasser in den Muskeln, das ist normal. Wer eine Nierenerkrankung hat, fragt vorher den Arzt.</li></ul><p>Alles andere (Fatburner, BCAA, Booster) kannst du dir sparen.</p>`]
 ]},
 t:{t:"Training einfach erklärt",d:"So holst du als Anfänger das Meiste raus. Tippe auf eine Frage.",items:[
  ["Wie läuft ein Training ab?",`<ol class="steps-ol"><li><b>Aufwärmen, 5 Minuten:</b> Hampelmann, Armkreisen, 10 Kniebeugen ohne Gewicht. Bei der ersten Übung 1 bis 2 leichte Sätze.</li><li><b>Übungen der Reihe nach:</b> Satz machen, in der App Häkchen setzen. Dann läuft die Pause automatisch.</li><li><b>Fertig tippen.</b> Die App speichert alles und schlägt beim nächsten Mal die Gewichte vor.</li><li><b>Danach essen:</b> eine Mahlzeit mit Protein in den nächsten 1 bis 2 Stunden.</li></ol><p>Dauer: 45 bis 60 Minuten.</p>`],
  ["Wie schwer soll es sein?",`<p>Neben jeder Übung steht ein Bereich, z. B. <b>6–8 Wiederholungen</b>. Nimm ein Gewicht, mit dem du mindestens die untere Zahl schaffst, und bei dem die <b>letzten 1 bis 2 Wiederholungen richtig schwer</b> sind, aber noch sauber.</p><p>Faustregel: Hör auf, wenn du höchstens noch 1 bis 2 saubere Wiederholungen schaffen würdest. <b>Technik geht immer vor Gewicht.</b></p>`],
  ["Wie werde ich stärker?",`<p>Die App arbeitet mit <b>doppelter Progression</b>:</p><ol class="steps-ol"><li>Du bleibst beim Gewicht und versuchst, jedes Mal eine Wiederholung mehr zu schaffen.</li><li>Schaffst du in <b>allen</b> Sätzen die obere Zahl (z. B. 3 × 8), trägt die App beim nächsten Mal automatisch mehr Gewicht ein.</li><li>Dann startest du wieder unten im Bereich und arbeitest dich hoch.</li></ol><p>Bei Übungen ohne Gewicht (Klimmzüge, Liegestütze, Bauch) steigerst du die Wiederholungen oder machst sie langsamer.</p>`],
  ["Wie lange Pause zwischen den Sätzen?",`<p>Bei großen Übungen (Kniebeugen, Bankdrücken, Klimmzüge) 2 bis 3 Minuten, bei kleinen (Curls, Seitheben) etwa 1 Minute, beim Bauch 45 bis 60 Sekunden. Die App stellt die passende Pause automatisch ein.</p>`],
  ["Wie bekomme ich ein Sixpack?",`<p>Zwei Dinge müssen zusammenkommen:</p><ol class="steps-ol"><li><b>Bauchmuskeln aufbauen:</b> Darum ist in jedem Training Bauch dabei, mit Steigerung wie bei anderen Muskeln.</li><li><b>Wenig Körperfett:</b> Sichtbar wird der Bauch bei Männern meist ab etwa 10 bis 12 % Körperfett. Dafür ist die Diätphase im Mai da.</li></ol><p>Fett gezielt am Bauch wegtrainieren geht leider nicht. Tausende Crunches ersetzen die Diät nicht.</p>`],
  ["Muskelkater und Schmerzen",`<ul class="bullets"><li><b>Muskelkater</b> (1 bis 3 Tage ziehende Muskeln) ist am Anfang normal und wird schnell weniger. Du darfst trotzdem trainieren.</li><li><b>Stechender Schmerz</b> im Gelenk oder Rücken: sofort aufhören. Gewicht runter oder Übung weglassen. Hält es an, zum Arzt.</li></ul>`],
  ["Schlaf und Erholung",`<p>Muskeln wachsen in der Pause, nicht beim Training. <b>7 bis 9 Stunden Schlaf</b> machen einen großen Unterschied. Zwischen zwei Einheiten liegt im Plan immer mindestens ein Ruhetag für dieselben Muskeln.</p>`],
  ["Training verpasst: was nun?",`<p>Kein Stress. Mach beim nächsten Termin einfach mit der nächsten Einheit weiter. Nachholen musst du nichts. Solange du 2 bis 3 Mal pro Woche trainierst, kommst du voran.</p>`],
  ["Ab wann sehe ich Ergebnisse?",`<p>Nach 2 bis 4 Wochen wirst du deutlich stärker, weil dein Körper die Bewegungen lernt. Sichtbare Muskeln brauchen etwa 2 bis 3 Monate. Als Anfänger sind 0,5 bis 1 kg Muskeln pro Monat realistisch. Mach monatlich ein Foto, die App erinnert dich.</p>`]

  out.push({ok:e.P>=tg.P*0.95,c:"var(--c-essen)",t:"Protein: "+fmt(e.P)+" von "+fmt(tg.P)+" g",bar:e.P/tg.P,

/* ---------- workout session ---------- */
const sessEl=document.getElementById("session");
// Doppelte Progression: alle Sätze am oberen Ende der Spanne -> Gewicht hoch
function progUp(e,last){if(!e.rmax||!last||last.length<e.s)return 0;if(!last.every(z=>z.r>=e.rmax))return 0;return (last[0].w>0)?(e.inc||2.5):0}
function startSession(planId,evId){
  const p=planById(planId);if(!p)return;
  S.session={planId,evId:evId||null,start:Date.now(),ex:p.ex.map(e=>{const last=lastSets(e.n),up=progUp(e,last);return{n:e.n,r:e.r,rmax:e.rmax,up,sets:Array.from({length:e.s},(_,i)=>({w:(last&&last[i]?last[i].w:last&&last.length?last[last.length-1].w:e.w)+(up&&(last&&last.length?last[0].w:e.w)>0?up:0),r:e.r,ok:false}))}})};
  save();renderSession();
}
function renderSession(){
  const s=S.session;if(!s){sessEl.hidden=true;return}
  const p=planById(s.planId);sessEl.hidden=false;
  sessEl.innerHTML=`<div class="s-head"><div><p class="eyebrow">Training läuft · <span id="elapsed" class="num"></span></p><h2>${esc(p?p.name:"Training")}</h2></div>
   <div class="icon-row"><button class="btn" data-act="cancelSession" data-confirm>Abbrechen</button><button class="btn" style="background:var(--c-gym);color:#fff;border:0" data-act="finishSession">Fertig</button></div></div>
   <div class="s-body">${S.logs.length<8?`<details class="card k" style="padding:12px 14px"${S.logs.length<3?" open":""}><summary>So läuft dein Training</summary><div class="kb"><ol class="steps-ol small"><li>5 Minuten aufwärmen: Hampelmann, Armkreisen, 10 Kniebeugen ohne Gewicht.</li><li>Satz machen, dann Häkchen setzen. Die Pause startet automatisch.</li><li>Die letzten 1 bis 2 Wiederholungen sollen schwer sein, aber sauber.</li><li>Unsicher? Tippe bei der Übung auf „So geht's“.</li></ol></div></details>`:""}${s.ex.map((x,xi)=>{const last=lastSets(x.n),tm=isTimeEx(x.n),u=tm?"Sek.":"Wdh.";return `<div class="card"><div class="sec-h" style="align-items:center"><h3>${esc(x.n)}</h3><button class="howto" data-act="exInfo" data-n="${esc(x.n)}">So geht's</button></div>
     <p class="small muted" style="margin:2px 0 10px">${x.rmax?"Ziel: "+x.r+"–"+x.rmax+" "+u+" · ":""}${x.sets.every(z=>!+z.w)?"kg auf 0 lassen (eigenes Körpergewicht) · ":""}${last?"Letztes Mal: "+last.map(z=>z.r+"×"+(z.w?z.w.toLocaleString("de-DE")+" kg":"KG")).join(", "):x.sets.every(z=>!+z.w)?"Erstes Mal: so viele saubere Wiederholungen, wie im Ziel stehen.":"Erstes Mal: wähle ein Gewicht, das sich sauber schaffen lässt. Lieber zu leicht als zu schwer."}${x.up?` · <b style="color:var(--c-gym)">+${x.up.toLocaleString("de-DE")} kg, weil du letztes Mal überall ${x.rmax} geschafft hast</b>`:x.rmax&&last&&last.length&&!last[0].w&&last.every(z=>z.r>=x.rmax)?` · <b style="color:var(--c-gym)">Top. Mach es schwerer (langsamer, Rucksack)</b>`:""}</p>
     <div class="sets"><span class="h">Satz</span><span class="h">kg</span><span class="h">${u}</span><span></span>
     ${x.sets.map((z,si)=>`<span class="num"><b>${si+1}</b></span><input type="number" inputmode="decimal" step="0.5" value="${z.w}" data-ex="${xi}" data-set="${si}" data-f="w" aria-label="Gewicht Satz ${si+1}"><input type="number" inputmode="numeric" value="${z.r}" data-ex="${xi}" data-set="${si}" data-f="r" aria-label="Wiederholungen Satz ${si+1}"><button class="chk${z.ok?" on":""}" data-act="setDone" data-ex="${xi}" data-set="${si}" aria-label="Satz erledigt">${I.check}</button>`).join("")}</div>
     <button class="link" data-act="addSet" data-ex="${xi}">+ Satz</button></div>`}).join("")}</div>
   <div class="rest" id="restBar" hidden><b id="restT">1:30</b><button data-act="rest30">+30 s</button><button data-act="restSkip">Weiter</button></div>`;
  tick();
}
sessEl.addEventListener("input",ev=>{const t=ev.target;if(!t.dataset.f||!S.session)return;const v=parseFloat(String(t.value).replace(",","."));S.session.ex[+t.dataset.ex].sets[+t.dataset.set][t.dataset.f]=isNaN(v)?0:v;save()});
function finishSession(){
  const s=S.session;const p=planById(s.planId);
  const ex=s.ex.map(x=>({n:x.n,sets:x.sets.filter(z=>z.ok).map(z=>({w:+z.w||0,r:+z.r||0}))})).filter(x=>x.sets.length);
  if(!ex.length){toast("Hake mindestens einen Satz ab, bevor du speicherst.");return}
  const min=Math.max(1,Math.round((Date.now()-s.start)/60000));
  const prs=[];
  for(const x of ex){const prev=bestOf(x.n);const w=Math.max(...x.sets.map(z=>z.w));
    if(prev&&w>0&&w>prev.w)prs.push(x.n+" "+w.toLocaleString("de-DE")+" kg");
    else if(prev&&w===0&&prev.w===0){const r=Math.max(...x.sets.map(z=>z.r));if(r>prev.r)prs.push(x.n+" "+r+" Wdh.")}}
  S.logs.push({id:uid(),date:todayIso(),planId:s.planId,name:p?p.name:"Training",min,ex,prs});
  // remember new working weights in plan
  if(p)for(const e of p.ex){const x=ex.find(y=>y.n===e.n);if(x)e.w=Math.max(...x.sets.map(z=>z.w))}
  const ev=s.evId?findEv(s.evId):eventsOn(todayIso()).find(e=>e.type==="gym"&&e.plan===s.planId&&!e.done);
  if(ev)setDone(ev.id,true);
  const vol=ex.reduce((a,x)=>a+x.sets.reduce((b,z)=>b+z.w*z.r,0),0),n=ex.reduce((a,x)=>a+x.sets.length,0);
  S.session=null;ui.rest=null;commit();renderSession();
  toast(prs.length?`Neuer Rekord: ${prs.join(", ")}!`:`Gespeichert: ${n} ${n===1?"Satz":"Sätze"}, ${fmt(vol)} kg bewegt. Jetzt Protein!`);
}

let actx=null,beepT=null;

const ringEl=document.getElementById("ring");
function ringNow(label){
  ringEl.innerHTML=`<p class="eyebrow" style="color:inherit">Wecker</p><div class="t">${nowHM()}</div><h2>${esc(label)}</h2><button class="solid" data-act="ringOff">Ausschalten</button><button data-act="snooze">Schlummern, 5 Min.</button>`;
  ringEl.hidden=false;clearInterval(beepT);beep();beepT=setInterval(beep,1200);
  if(navigator.vibrate)try{navigator.vibrate([400,200,400])}catch(e){}
}
function checkTimers(){
  const now=new Date(),hm=nowHM(),t=todayIso(),key=t+" "+hm;S.fired=S.fired||{};
  for(const a of S.alarms){if(a.on&&a.days.includes(now.getDay())&&a.time===hm&&S.fired[a.id]!==key){S.fired[a.id]=key;save();ringNow(a.label||"Wecker")}}
  if(S.snooze&&Date.now()>=S.snooze.at){const l=S.snooze.label;S.snooze=null;save();ringNow(l)}
  for(const e of eventsOn(t)){if(!e.reminder||!e.time||e.done)continue;
    const [h,m]=e.time.split(":").map(Number);const at=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m-e.reminder);
    if(pad(at.getHours())+":"+pad(at.getMinutes())===hm&&S.fired[e.id]!==key){S.fired[e.id]=key;save();beep();toast(`In ${e.reminder} Min.: ${evTitle(e)}`)}}
}
function tick(){
  if(S.session){const el=document.getElementById("elapsed");if(el){const s=Math.floor((Date.now()-S.session.start)/1000);el.textContent=Math.floor(s/60)+":"+pad(s%60)}}
  const rb=document.getElementById("restBar");
  if(rb){if(ui.rest){const left=Math.ceil((ui.rest-Date.now())/1000);if(left<=0){ui.rest=null;rb.hidden=true;beep();if(navigator.vibrate)try{navigator.vibrate(300)}catch(e){}}else{rb.hidden=false;document.getElementById("restT").textContent="Pause "+Math.floor(left/60)+":"+pad(left%60)}}else rb.hidden=true}
}

  return {v:1,updated:new Date().toISOString(),date:t,name:S.profile.name,
    kcal:Math.round(e.kcal),kcalTarget:Math.round(tg.kcal),protein:Math.round(e.P),proteinTarget:Math.round(tg.P),
    carbs:Math.round(e.C),carbsTarget:Math.round(tg.C),fat:Math.round(e.F),fatTarget:Math.round(tg.F),trainingDay:!!tg.train,
    phase:(()=>{const ph=tg.phase,nx=nextPhase(t);if(!ph)return null;return {name:ph.name,daysLeft:ph.to?Math.round((parseIso(ph.to)-parseIso(t))/864e5)+1:null,next:nx?nx.name:null,nextFrom:nx?nx.from:null}})(),
    water:(S.water||{})[t]||0,waterGoal:Math.round(S.profile.weight*0.035/0.25),
    alarm:na?{time:pad(na.at.getHours())+":"+pad(na.at.getMinutes()),day:relDate(iso(na.at)),label:na.a.label}:null,
    training:next?{name:planById(next.plan)?.name||"Training",day:relDate(next.date),time:next.time}:null,

    shopping:S.shopping.filter(x=>!x.done).map(x=>x.n).slice(0,8),shoppingOpen:S.shopping.filter(x=>!x.done).length,
    appUrl:location.href.split("#")[0]};
}
/* Kalender-Abo: echte iOS-Mitteilungen auch bei geschlossener App (iPhone-Kalender liest das Gist) */
function icsFeed(){
  const tx=s=>String(s).replace(/\\/g,"\\\\").replace(/[,;]/g,m=>"\\"+m).replace(/\r?\n/g,"\\n");
  const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",dt=(d,t)=>d.replace(/-/g,"")+"T"+t.replace(":","")+"00";
  const end=(d,t,min)=>{const [h,m]=t.split(":").map(Number);const x=new Date(parseIso(d));x.setHours(h,m+min);return iso(x).replace(/-/g,"")+"T"+pad(x.getHours())+pad(x.getMinutes())+"00"};
  const al=(trig,txt)=>["BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+tx(txt),"TRIGGER:"+trig,"END:VALARM"];
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Lifeplanner//DE","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Lifeplanner","REFRESH-INTERVAL;VALUE=DURATION:PT1H","X-PUBLISHED-TTL:PT1H"];
  for(const e of upcoming(60)){if(!e.time||e.done)continue;const title=evTitle(e);
    L.push("BEGIN:VEVENT","UID:"+String(e.id).replace(/[^\w@.-]/g,"")+"@lifeplanner","DTSTAMP:"+stamp,"DTSTART:"+dt(e.date,e.time),"DTEND:"+end(e.date,e.time,e.type==="gym"?75:e.type==="termin"?60:30),"SUMMARY:"+tx(title),
      ...(e.reminder>0?al("-PT"+e.reminder+"M",title):e.ph||e.type==="essen"||e.type==="aufgabe"?al("PT0M",title):[]),"END:VEVENT")}
  const BD=["SU","MO","TU","WE","TH","FR","SA"],t=todayIso();
  for(const a of S.alarms){if(!a.on||!a.days.length)continue;
    L.push("BEGIN:VEVENT","UID:alarm-"+a.id+"@lifeplanner","DTSTAMP:"+stamp,"DTSTART:"+dt(t,a.time),"DTEND:"+end(t,a.time,5),"RRULE:FREQ=WEEKLY;BYDAY="+a.days.map(d=>BD[d]).join(","),"SUMMARY:"+tx("⏰ "+(a.label||"Wecker")),...al("PT0M",a.label||"Wecker"),"END:VEVENT")}
  for(const ph of S.phases||[]){if(ph.from<=t)continue;const d=ph.from.replace(/-/g,""),nd=iso(addDays(parseIso(ph.from),1)).replace(/-/g,"");
    L.push("BEGIN:VEVENT","UID:phase-"+ph.id+"@lifeplanner","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+d,"DTEND;VALUE=DATE:"+nd,"SUMMARY:"+tx("Neue Phase: "+ph.name),"DESCRIPTION:"+tx("Lifeplanner stellt Kalorien und Makros heute automatisch um."),
      ...al("-P6DT15H","In einer Woche startet: "+ph.name),...al("PT9H","Ab heute: "+ph.name),"END:VEVENT")}
  L.push("END:VCALENDAR");
  return L.map(l=>{let o="",u=l;while(u.length>73){o+=u.slice(0,73)+"\r\n ";u=u.slice(73)}return o+u}).join("\r\n");
}
let syncT=null;
function queueSync(){if(!S.sync||!S.sync.token||inFrame)return;clearTimeout(syncT);syncT=setTimeout(pushSync,3000)}
async function pushSync(manual){
  const sy=S.sync;if(!sy||!sy.token)return false;
  const body={description:"Lifeplanner Widget-Daten",files:{"lifeplanner-widget.json":{content:JSON.stringify(widgetSummary())},"lifeplanner.ics":{content:icsFeed()}}};
  try{
    const r=await fetch("https://api.github.com/gists"+(sy.gistId?"/"+sy.gistId:""),{method:sy.gistId?"PATCH":"POST",
      headers:{"Authorization":"Bearer "+sy.token,"Accept":"application/vnd.github+json","Content-Type":"application/json"},
      body:JSON.stringify(sy.gistId?body:{...body,public:false})});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    if(!sy.gistId){sy.gistId=j.id;sy.owner=j.owner&&j.owner.login;}
    sy.last=new Date().toISOString();sy.err="";
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    if(manual)toast("Widget-Daten aktualisiert");
    return true;
  }catch(e){sy.err=String(e.message||e);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){}if(manual)toast(sy.err==="401"?"Der Token stimmt nicht.":"Sync fehlgeschlagen. Bist du online?");return false}
}
const calUrl=()=>S.sync&&S.sync.gistId&&S.sync.owner?`webcal://gist.githubusercontent.com/${S.sync.owner}/${S.sync.gistId}/raw/lifeplanner.ics`:"";
const widgetUrl=()=>S.sync&&S.sync.gistId&&S.sync.owner?`https://gist.githubusercontent.com/${S.sync.owner}/${S.sync.gistId}/raw/lifeplanner-widget.json`:"";
setInterval(()=>{if(S.sync&&S.sync.token&&!inFrame&&document.visibilityState==="visible")pushSync()},15*60000);

/* ---------- ics (only outside the preview frame) ---------- */
function icsFor(e){
  const dt=e.date.replace(/-/g,"")+"T"+e.time.replace(":","")+"00";
  const dur=e.type==="gym"?90:60;const [h,m]=e.time.split(":").map(Number);const end=new Date(parseIso(e.date));end.setHours(h,m+dur);
  const de=iso(end).replace(/-/g,"")+"T"+pad(end.getHours())+pad(end.getMinutes())+"00";
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Lifeplanner//DE","BEGIN:VEVENT","UID:"+e.id+"@lifeplanner","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z","DTSTART:"+dt,"DTEND:"+de,"SUMMARY:"+evTitle(e).replace(/[,;]/g," "),
    ...(e.reminder?["BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+evTitle(e).replace(/[,;]/g," "),"TRIGGER:-PT"+e.reminder+"M","END:VALARM"]:[]),"END:VEVENT","END:VCALENDAR"].join("\r\n");
}

      title:type==="termin"||type==="aufgabe"?String(fd.get("title")).trim():"",plan:type==="gym"?fd.get("plan"):undefined,recipe:type==="essen"?fd.get("recipe"):undefined};

  plan:fd=>{
    const lines=String(fd.get("ex")).split("\n").map(s=>s.trim()).filter(Boolean),ex=[];
    const old=id=>{const p=planById(fd.get("id"));return p?p.ex:[]};
    for(const l of lines){const m=l.match(/^(.*?)\s+(\d+)\s*[x×]\s*(\d+)(?:\s*[-–]\s*(\d+))?(?:\s+(\d+(?:[.,]\d+)?))?\s*(?:kg)?$/i);
      const o=m?old().find(e=>e.n===m[1]):null;
      ex.push(m?{n:m[1],s:+m[2],r:+m[3],rmax:m[4]?+m[4]:undefined,w:m[5]?parseFloat(m[5].replace(",",".")):0,inc:o&&o.inc}:{n:l,s:3,r:10,w:0})}
    if(!ex.length){toast("Bitte mindestens eine Übung eintragen.");return}
    const id=fd.get("id"),name=String(fd.get("name")).trim()||"Neuer Plan";
    if(id)Object.assign(planById(id),{name,ex});else S.plans.push({id:uid(),name,ex});
    closeSheet();commit();toast("Plan gespeichert");
  },
  alarm:fd=>{
    const days=fd.getAll("d").map(Number);if(!days.length){toast("Wähle mindestens einen Tag.");return}
    S.alarms.push({id:uid(),time:fd.get("time"),label:String(fd.get("label")).trim()||"Wecker",days,on:true});
    S.alarms.sort((a,b)=>a.time<b.time?-1:1);save();alarmSheet();render(true);toast("Wecker gestellt");
  },
  weight:(fd,f)=>{
    const kg=parseFloat(String(fd.get("kg")).replace(",","."));if(!(kg>30&&kg<300)){toast("Bitte ein Gewicht in kg eingeben.");return}
    S.weights=(S.weights||[]).filter(z=>z.date!==todayIso());S.weights.push({date:todayIso(),kg});S.profile.weight=kg;closeSheet();commit();toast("Gewicht gespeichert. Ziele angepasst.");
  },
  profile:fd=>{
    const p=S.profile;const num=k=>{const v=String(fd.get(k)??"").replace(",",".").trim();return v===""?null:+v};p.surplus=num("surplus");p.pkg=num("pkg");p.name=String(fd.get("name")).trim()||"du";p.weight=+fd.get("weight")||p.weight;p.height=+fd.get("height")||p.height;
    p.age=+fd.get("age")||p.age;p.sex=fd.get("sex");p.goal=fd.get("goal");p.act=+fd.get("act");p.example=false;
    closeSheet();commit();toast("Profil gespeichert. Ziele neu berechnet.");
  }
};
document.addEventListener("submit",ev=>{ev.preventDefault();const f=ev.target,fn=F[f.dataset.form];if(fn)fn(new FormData(f),f)});

/* ---------- boot ---------- */
if(S.phases&&(S.phasesVer||1)<PHASES_VER){applyPhases();if(S.profile.surplus==null||S.profile.surplus===400)S.profile.surplus=550;save()}
const h=(location.hash||"").slice(1);
if(V[h])ui.view=h;
window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(V[v]&&v!==ui.view){ui.view=v;render()}});
if(Array.isArray(S.widgets)&&!S.widgets.some(x=>x[0]==="fokus")){S.widgets.unshift(["fokus",1]);save()}
render();renderSession();checkTimers();
if(needsOnb()&&!S.session)showOnb();
})();
</script>

<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
