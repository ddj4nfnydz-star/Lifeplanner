<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lifeplanner">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Lifeplanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app; scrolling content area above a fixed tab bar; bottom sheets for input. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#101827; --muted:#5A6577; --line:#DCE2EA;
  --accent:#1E56F0; --on-accent:#FFFFFF;
  --c-termin:#1E56F0; --c-gym:#E8571F; --c-essen:#128A5E; --c-aufgabe:#7D45D1;
  --good:#128A5E; --warn:#B57B00; --bad:#D03535;
  --shadow:0 1px 2px rgba(16,24,39,.06),0 6px 20px rgba(16,24,39,.06);
  --font-d:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --font-b:"Manrope",-apple-system,"Segoe UI",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0E15; --surface:#141A24; --surface-2:#1A212D; --ink:#E9EEF6; --muted:#97A3B6; --line:#262F3E;
  --accent:#5C8BFF; --on-accent:#08101F;
  --c-termin:#5C8BFF; --c-gym:#FF7A45; --c-essen:#2FBF88; --c-aufgabe:#A97CF2;
  --good:#2FBF88; --warn:#E3AE3C; --bad:#FF6B6B; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E15; --surface:#141A24; --surface-2:#1A212D; --ink:#E9EEF6; --muted:#97A3B6; --line:#262F3E;
  --accent:#5C8BFF; --on-accent:#08101F;
  --c-termin:#5C8BFF; --c-gym:#FF7A45; --c-essen:#2FBF88; --c-aufgabe:#A97CF2;
  --good:#2FBF88; --warn:#E3AE3C; --bad:#FF6B6B; --shadow:none; color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-d);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.1}
h2{font-size:19px}
h3{font-size:17px}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;display:flex;flex-direction:column}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 96px}
.view{display:flex;flex-direction:column;gap:22px;max-width:640px;margin:0 auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:700;font-size:14px}
.muted{color:var(--muted)}
.small{font-size:13px}

.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn:disabled{opacity:.3}
.icon-row{display:flex;gap:8px}

.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);padding:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;box-shadow:var(--shadow)}
.tile .big{font-family:var(--font-d);font-size:30px;font-weight:700;line-height:1}
.tile .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* timeline items */
.list{display:flex;flex-direction:column;gap:8px}
.item{--c:var(--c-termin);display:grid;grid-template-columns:48px 4px 1fr auto;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left;width:100%}
.item.t-gym{--c:var(--c-gym)} .item.t-essen{--c:var(--c-essen)} .item.t-aufgabe{--c:var(--c-aufgabe)}
.item .time{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.item .bar{align-self:stretch;border-radius:4px;background:var(--c)}
.item .body{min-width:0}
.item .ttl{font-weight:700;overflow-wrap:anywhere}
.item .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item.done .ttl{text-decoration:line-through;color:var(--muted)}
.item.done .bar{opacity:.35}
.pill{border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);white-space:nowrap}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--c);background:transparent;display:grid;place-items:center;padding:0}
.chk svg{width:16px;height:16px;opacity:0}
.done .chk{background:var(--c)} .done .chk svg{opacity:1;color:var(--surface)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent))}
.empty{padding:18px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}

.tip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.tip .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--c-essen)) 15%,transparent);color:var(--c,var(--c-essen))}
.tip .dot svg{width:18px;height:18px}
.tip b{display:block}

.notice{display:flex;gap:10px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:14px;padding:10px 12px;font-size:13px}
.notice button{flex:none}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-weight:700}
.primary{border:0;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:13px 16px;font-weight:700;width:100%}
.danger{color:var(--bad)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row>*{flex:1}

/* rings & bars */
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring .in b{font-family:var(--font-d);font-size:22px}
.ring .in span{font-size:11px;color:var(--muted)}
.macro{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:13px}
.macro .track{grid-column:1/-1}
.track{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.track i{display:block;height:100%;border-radius:8px;background:var(--c,var(--accent))}
.nut{display:flex;gap:16px;align-items:center}
.nut .macros{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}


/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid7 .wd{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em}
.day{border:0;background:transparent;border-radius:12px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-variant-numeric:tabular-nums;font-weight:600}
.day.out{opacity:.35}
.day.today span:first-child{color:var(--accent);font-weight:800}
.day.sel{background:var(--ink);color:var(--bg)}
.day.sel.today span:first-child{color:var(--bg)}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%}
.d-termin{background:var(--c-termin)} .d-gym{background:var(--c-gym)} .d-essen{background:var(--c-essen)} .d-aufgabe{background:var(--c-aufgabe)}

/* gym */
.plan{display:flex;flex-direction:column;gap:10px}
.plan .ex{font-size:13px;color:var(--muted)}
.prog{display:grid;grid-template-columns:1fr 92px auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prog:first-child{border-top:0;padding-top:0}
.prog svg{width:92px;height:30px;overflow:visible}
.delta{font-size:12px;font-weight:700;color:var(--good)}

/* shopping */
.add-bar{display:flex;gap:8px}
.add-bar input{flex:1;min-width:0}
.shop{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line)}
.shop:first-of-type{border-top:0}
.shop .chk{--c:var(--c-essen);flex:none}
.shop.done .chk{background:var(--c)} .shop.done .chk svg{opacity:1;color:var(--surface)}
.shop.done .nm{text-decoration:line-through;color:var(--muted)}
.shop .nm{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.shop .src{display:block;font-size:12px;color:var(--muted);font-weight:500}
.shop .qty{color:var(--muted);font-size:13px;white-space:nowrap}

.sug{flex-wrap:wrap}.sug .nm{flex-basis:100%}.sug .btn{flex:1}
/* forms */
input,select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px}
textarea{min-height:120px;resize:vertical}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
.form label.check{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-weight:600;font-size:14px}
.form label.check input{width:20px;height:20px;flex:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>*{min-width:0}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg label{flex:1;display:block;text-align:center;cursor:pointer;position:relative;color:var(--ink)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:8px 2px;border-radius:9px;font-size:13px;font-weight:700}
.seg input:checked+span{background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.form[data-type="termin"] [data-for]:not([data-for~="termin"]),
.form[data-type="aufgabe"] [data-for]:not([data-for~="aufgabe"]),
.form[data-type="gym"] [data-for]:not([data-for~="gym"]),
.form[data-type="essen"] [data-for]:not([data-for~="essen"]){display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{flex-direction:row}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips span{display:block;padding:7px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.chips input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.food{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.food small{color:var(--muted);display:block}
.food .plus{font-weight:800;color:var(--accent);font-size:20px;line-height:1}

.swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0}
.looks{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:12px;padding:4px 12px}
.lookrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-weight:600;font-size:14px}
.lookrow input{width:46px;height:32px;padding:2px;border-radius:8px;flex:none}
/* tab bar */
nav.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:4px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 6px;font-size:11px;font-weight:700;color:var(--muted)}
nav.tabs svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

#fab{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 2px);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:15;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 45%,transparent)}
#fab svg{width:26px;height:26px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick button{--c:var(--accent);display:flex;align-items:center;gap:10px;text-align:left;padding:14px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-weight:700}
.quick button i{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none}
/* sheet */
#sheet{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
#sheet .backdrop{position:absolute;inset:0;background:rgba(5,10,20,.45)}
#sheet .panel{position:relative;background:var(--surface);border-radius:22px 22px 0 0;max-height:88%;overflow-y:auto;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 14px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.sheet-sec{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.sheet-sec h4{margin:0;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}

/* alarms */
.alarm{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.alarm:first-child{border-top:0}
.alarm .t{font-family:var(--font-d);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.alarm .meta{flex:1;min-width:0}
.alarm.off .t,.alarm.off .meta{opacity:.45}
.switch{width:50px;height:30px;border-radius:30px;border:0;background:var(--line);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* workout session */
#session{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
#session .s-head{padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
#session .s-body{flex:1;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sets{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;align-items:center}
.sets .h{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sets input{padding:9px 10px;text-align:center}
.sets .chk{--c:var(--c-gym);width:40px;height:40px}
.sets .chk.on{background:var(--c)} .sets .chk.on svg{opacity:1;color:var(--surface)}
.rest{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--ink);color:var(--bg);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.rest b{font-family:var(--font-d);font-size:26px;font-variant-numeric:tabular-nums;flex:1}
.rest button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:10px;padding:8px 12px;font-weight:700}

/* ringing alarm + toast */
#ring{position:fixed;inset:0;z-index:50;background:var(--accent);color:var(--on-accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#ring .t{font-family:var(--font-d);font-size:72px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
#ring button{border:2px solid currentColor;background:transparent;color:inherit;border-radius:14px;padding:14px 22px;font-weight:800;min-width:220px}
#ring button.solid{background:var(--on-accent);color:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <main id="main" tabindex="-1"></main>
  <nav class="tabs" aria-label="Bereiche">

    <button data-act="go" data-view="essen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-4.4 0-8-3.4-8-8 0-3.6 2.4-6 5.2-6 1.2 0 2 .4 2.8.9.8-.5 1.6-.9 2.8-.9 2.8 0 5.2 2.4 5.2 6 0 4.6-3.6 8-8 8z"/><path d="M12 7.9C12 5.5 13 3.8 15 3"/></svg>Essen</button>
    <button data-act="go" data-view="einkauf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.3 11.1a2 2 0 0 1-2 1.9H8.3a2 2 0 0 1-2-1.9z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Einkauf</button>
  </nav>
  <button id="fab" data-act="quick" aria-label="Schnell hinzufügen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<div id="sheet" hidden><div class="backdrop" data-act="closeSheet"></div><div class="panel" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div id="session" hidden></div>
<div id="ring" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */

  if(!e.rep)return e.date===date;
  if(date<e.date||(e.until&&date>e.until))return false;
  const d=parseIso(date),st=parseIso(e.date);
  switch(e.rep){case"daily":return true;case"weekdays":return d.getDay()>0&&d.getDay()<6;case"weekly":return d.getDay()===st.getDay();
    case"biweekly":return d.getDay()===st.getDay()&&Math.round((d-st)/864e5/7)%2===0;case"monthly":return d.getDate()===st.getDate()}
  return false;
}

function applyProgram(v){v=PROG_VARIANTS[v]?v:"home";

  const all=PROGRAM.plans.map(p=>p.id),keep=PROG_VARIANTS[v].plans,old={};for(const p of S.plans)old[p.id]=p;
  S.plans=S.plans.filter(p=>!["p1","p2","p3"].includes(p.id)&&!all.includes(p.id)).concat(PROGRAM.plans.filter(p=>keep.includes(p.id)).map(p=>old[p.id]||JSON.parse(JSON.stringify(p))));
  for(const r of PROGRAM.recipes)if(!recipeById(r.id))S.recipes.push(JSON.parse(JSON.stringify(r)));
  const t=todayIso();
  S.events=S.events.filter(e=>!(e.type==="gym"&&(e.prog||(!e.rep&&!e.done&&e.date>=t)))&&!(e.prog));
  const now=new Date(),dow=(now.getDay()+6)%7,mon=addDays(now,dow===0?0:7-dow),d=n=>iso(addDays(mon,n));

  ev(d(0),"gA","biweekly");ev(d(7),"gB","biweekly");ev(d(2),"gB","biweekly");ev(d(9),"gA","biweekly");ev(d(4),"gA","biweekly");ev(d(11),"gB","biweekly");
  ev(d(5),"gH","weekly","11:00")}

function weightTrend(){
  const w=(S.weights||[]).slice().sort((a,b)=>a.date<b.date?-1:1);if(w.length<2)return null;
  const last=w[w.length-1].date,avg=(from,to)=>{const x=w.filter(z=>z.date>from&&z.date<=to);return x.length?x.reduce((a,z)=>a+z.kg,0)/x.length:null};
  const a1=avg(iso(addDays(parseIso(last),-7)),last),a0=avg(iso(addDays(parseIso(last),-14)),iso(addDays(parseIso(last),-7)));
  const span=(parseIso(last)-parseIso(w[0].date))/864e5;
  if(a0==null||span<10)return {now:a1,perWeek:null};
  return {now:a1,perWeek:a1-a0};
}
function eaten(date){
  return S.meals.filter(m=>m.date===date).reduce((a,m)=>({kcal:a.kcal+m.kcal,P:a.P+m.P,C:a.C+m.C,F:a.F+m.F}),{kcal:0,P:0,C:0,F:0});
}
function tips(date){
  const t=targets(date),e=eaten(date),out=[],h=new Date().getHours();
  const gym=eventsOn(date).find(x=>x.type==="gym"&&!x.done);
  const missP=t.P-e.P;
  if(gym){
    const p=planById(gym.plan);
    out.push({c:"var(--c-gym)",i:I.bolt,t:(p?p.name:"Training")+(gym.time?" um "+gym.time:" heute"),d:"Iss 2 bis 3 Stunden vorher etwas mit Kohlenhydraten, z. B. Reis oder Haferflocken. Danach 30 bis 40 g Protein. Dein Ziel liegt heute 250 kcal höher."});
  }
  if(missP>25){
    out.push({c:"var(--c-essen)",i:I.leaf,t:"Noch "+fmt(missP)+" g Protein offen",d:missP>45?"Zum Beispiel 250 g Magerquark (30 g) und eine Hähnchenbrust (35 g).":"Ein Skyr (16 g) und ein Proteinshake (24 g) reichen dafür."});
  }else if(e.kcal>0){
    out.push({c:"var(--c-essen)",i:I.leaf,t:"Proteinziel fast erreicht",d:"Gut gemacht. Achte beim Rest des Tages auf Gemüse und genug Wasser."});
  }
  if(e.kcal>t.kcal+150)out.push({c:"var(--warn)",i:I.leaf,t:"Kalorienziel überschritten",d:"Kein Drama. Halte den Rest des Tages leicht, z. B. Gemüse mit magerem Eiweiß."});
  else if(h>=19&&t.kcal-e.kcal>700)out.push({c:"var(--warn)",i:I.leaf,t:"Noch "+fmt(t.kcal-e.kcal)+" kcal übrig",d:"Für den Muskelaufbau lohnt sich eine Mahlzeit am Abend, z. B. Lachs mit Ofengemüse."});
  const nx=nextPhase(date);if(nx&&date===todayIso()){const dd=Math.round((parseIso(nx.from)-parseIso(date))/864e5);if(dd<=14)out.push({c:"var(--warn)",i:I.leaf,t:"In "+dd+" Tagen: "+nx.name,d:nx.goal==="abnehmen"?"Dann stellt die App auf ein Defizit von 500 kcal um, Protein steigt auf 2,3 g pro kg. Training bleibt schwer, damit die Muskeln bleiben.":"Dann gehen die Kalorien auf Erhalt hoch. Fahr sie über 2 Wochen langsam an."})}
  if(goalOn(date)==="abnehmen"&&date===todayIso()){const tr=weightTrend();
    out.push({c:"var(--c-essen)",i:I.leaf,t:"Diät: satt bleiben",d:"Viel Volumen: Gemüse, Kartoffeln, mageres Fleisch, Skyr. Shake mit Wasser statt Vollmilch, Erdnussbutter weglassen."});
    if(tr&&tr.perWeek!=null){if(tr.perWeek>-0.3)out.push({c:"var(--warn)",i:I.leaf,t:"Gewicht sinkt kaum",d:"Ziel sind 0,4 bis 0,8 kg pro Woche. Nimm 150 kcal weniger oder mach täglich 3.000 Schritte mehr."});
      else if(tr.perWeek<-1)out.push({c:"var(--warn)",i:I.leaf,t:"Zu schneller Verlust",d:"Mehr als 1 kg pro Woche kostet Muskeln. Iss 150 bis 200 kcal mehr."});
      else out.push({c:"var(--c-essen)",i:I.leaf,t:"Diät im Plan",d:tr.perWeek.toLocaleString("de-DE",{maximumFractionDigits:2})+" kg pro Woche. Genau richtig."})}}
  if(goalOn(date)==="aufbau"&&date===todayIso()){
    if(h<14)out.push({c:"var(--c-essen)",i:I.leaf,t:"Mittag bestellen",d:"Nimm etwas mit viel Fleisch oder Fisch plus Reis, Nudeln oder Brot, z. B. Bowl, Döner, Curry mit Reis, Pasta mit Hähnchen. Extra Fleisch dazubestellen lohnt sich. Ziel: etwa 800 kcal und 40 g Protein."});
    else if(e.kcal<t.kcal*0.6)out.push({c:"var(--c-essen)",i:I.leaf,t:"Abends ohne Kochen",d:"Quark-Bowl, Hähnchen-Wraps oder Express-Reis mit Thunfisch: alle unter 5 Minuten und 700+ kcal. Kalorien trinken ist leichter als essen: ein Glas Vollmilch hat 130 kcal."});
    const tr=weightTrend();
    if(tr&&tr.perWeek!=null){
      if(tr.perWeek<0.1)out.push({c:"var(--warn)",i:I.leaf,t:"Gewicht steht still",d:"In den letzten zwei Wochen kaum Zunahme. Erhöhe dein Ziel um 150 kcal (Profil) oder trink einen zusätzlichen Shake."});
      else if(tr.perWeek>0.7)out.push({c:"var(--warn)",i:I.leaf,t:"Zunahme recht schnell",d:"Mehr als 0,7 kg pro Woche ist oft viel Fett. 100 bis 150 kcal weniger reichen."});
      else out.push({c:"var(--c-essen)",i:I.leaf,t:"Zunahme im Ziel",d:"+"+tr.perWeek.toLocaleString("de-DE",{maximumFractionDigits:2})+" kg pro Woche. Genau richtig für zügigen Muskelaufbau."});
    }
  }
  out.push({c:"var(--c-termin)",i:I.drop,t:"Wasser: etwa "+(Math.round(S.profile.weight*0.035*10)/10).toLocaleString("de-DE")+" Liter",d:t.train?"An Trainingstagen gern einen halben Liter mehr.":"Ein Glas zu jeder Mahlzeit ist ein einfacher Anker."});
  return out;
}
function nextAlarm(){
  const now=new Date();let best=null;
  for(const a of S.alarms){if(!a.on)continue;
    for(let i=0;i<8;i++){const d=addDays(now,i);if(!a.days.includes(d.getDay()))continue;
      const [hh,mm]=a.time.split(":").map(Number);const at=new Date(d.getFullYear(),d.getMonth(),d.getDate(),hh,mm);
      if(at>now){if(!best||at<best.at)best={at,a};break}}}
  return best;
}
function bestOf(name){let best=null;
  for(const l of S.logs)for(const x of l.ex)if(x.n===name)for(const z of x.sets){if(!best||z.w>best.w||(z.w===best.w&&z.r>best.r))best={w:z.w,r:z.r,date:l.date}}
  return best}
function lastSets(name){
  for(let i=S.logs.length-1;i>=0;i--){const x=S.logs[i].ex.find(e=>e.n===name);if(x&&x.sets.length)return x.sets}
  return null;
}
function addIngredients(r){
  let n=0;
  for(const g of r.ing){
    if(S.shopping.some(s=>!s.done&&s.n.toLowerCase()===g.n.toLowerCase()))continue;
    S.shopping.push({id:uid(),n:g.n,m:g.m,cat:guessCat(g.n),src:r.name});n++;
  }
  return n;
}

function proteinSuggestions(date){
  const tg=targets(date),e=eaten(date),miss=tg.P-e.P,kcalLeft=tg.kcal-e.kcal;

function spark(vals){

  wecker:{n:"Wecker",size:"s",r(){const na=nextAlarm(),t=todayIso();const txt=na?(iso(na.at)===t?"Heute":iso(na.at)===iso(addDays(new Date(),1))?"Morgen":WDL[na.at.getDay()]):"";
    return `<button class="tile" data-act="alarms"><span class="lbl">Wecker</span><span class="big num">${na?pad(na.at.getHours())+":"+pad(na.at.getMinutes()):"Aus"}</span><span class="small muted">${na?txt+" · "+esc(na.a.label):"Kein Wecker aktiv"}</span></button>`}},
  kalorien:{n:"Kalorien & Protein",size:"s",r(){const t=todayIso(),tg=targets(t),e=eaten(t);
    return `<button class="tile" data-act="go" data-view="essen"><span class="lbl">Ernährung</span><span class="big num">${fmt(Math.max(0,tg.kcal-e.kcal))}</span><span class="small muted">kcal übrig · ${fmt(e.P)}/${fmt(tg.P)} g Protein</span></button>`}},
  training:{n:"Nächstes Training",size:"s",r(){const next=upcoming(21).find(e=>e.type==="gym"&&!e.done);
    return `<button class="tile" style="--c:var(--c-gym)" data-act="go" data-view="gym"><span class="lbl">Training</span><span class="big" style="font-size:24px;color:var(--c-gym)">${next?esc(planById(next.plan)?.name||"Training"):"–"}</span><span class="small muted">${next?relDate(next.date)+(next.time?", "+next.time:""):"Nichts geplant"}</span></button>`}},
  wasser:{n:"Wasser",size:"s",r(){const t=todayIso(),n=(S.water||{})[t]||0,goal=Math.round(S.profile.weight*0.035/0.25);
    return `<div class="tile"><span class="lbl">Wasser</span><span class="big num">${n}<span class="muted" style="font-size:16px"> / ${goal} Gläser</span></span><div class="btn-row" style="gap:6px"><button class="btn" style="padding:6px" data-act="water" data-d="-1" aria-label="Ein Glas weniger">−</button><button class="btn" style="padding:6px;background:var(--c-termin);color:var(--surface);border:0" data-act="water" data-d="1" aria-label="Ein Glas mehr">+</button></div></div>`}},
  tag:{n:"Dein Tag",size:"l",r(){const evs=eventsOn(todayIso());
    return `<section class="sec"><div class="sec-h"><h2>Dein Tag</h2><button class="link" data-act="go" data-view="kalender">Kalender</button></div><div class="list">${evs.length?evs.map(itemRow).join(""):`<div class="empty">Heute ist noch nichts geplant.</div>`}</div></section>`}},
  woche:{n:"Woche",size:"l",r(){let cells="";const now=new Date();
    for(let i=0;i<7;i++){const d=addDays(now,i),s=iso(d),ev=eventsOn(s);const types=[...new Set(ev.map(e=>e.type))];
      cells+=`<button class="day${i===0?" today":""}" data-act="pickGo" data-d="${s}" aria-label="${longDate(s)}"><span class="small muted">${WD[d.getDay()]}</span><span>${d.getDate()}</span><span class="dots">${types.map(t=>`<i class="d-${t}"></i>`).join("")}</span></button>`}
    return `<section class="sec"><h2>Nächste 7 Tage</h2><div class="card"><div class="grid7">${cells}</div></div></section>`}},
  aufgaben:{n:"Offene Aufgaben",size:"l",r(){const t=todayIso(),list=S.events.filter(e=>!e.rep&&e.type==="aufgabe"&&!e.done&&e.date<t).concat(upcoming(4).filter(e=>e.type==="aufgabe"&&!e.done)).slice(0,6);
    return `<section class="sec"><h2>Offene Aufgaben</h2><div class="list">${list.length?list.map(e=>itemRow({...e,time:e.date<t?"Fällig":e.date===t?(e.time||"Heute"):WD[parseIso(e.date).getDay()]})).join(""):`<div class="empty">Keine offenen Aufgaben.</div>`}</div></section>`}},
  tipp:{n:"Tipp für heute",size:"l",r(){return `<section class="sec"><h2>Tipp für heute</h2><div class="card">${tipList(tips(todayIso()).slice(0,1))}</div></section>`}},
  einkauf:{n:"Einkauf",size:"l",r(){const open=S.shopping.filter(s=>!s.done);
    return `<section class="sec"><div class="sec-h"><h2>Einkauf</h2><button class="link" data-act="go" data-view="einkauf">Liste öffnen</button></div><div class="card"><p><b class="num">${open.length}</b> ${open.length===1?"Sache":"Sachen"} offen${open.length?": <span class='muted'>"+esc(open.slice(0,4).map(s=>s.n).join(", "))+(open.length>4?" …":"")+"</span>":""}</p></div></section>`}}
};
const DEFAULT_WIDGETS=[["wecker",1],["kalorien",1],["tag",1],["training",1],["wasser",1],["woche",1],["tipp",1],["aufgaben",0],["einkauf",1]];
function widgetList(){
  let w=Array.isArray(S.widgets)?S.widgets.filter(x=>WIDGETS[x[0]]):[];
  for(const d of DEFAULT_WIDGETS)if(!w.some(x=>x[0]===d[0]))w.push([d[0],0]);
  if(!Array.isArray(S.widgets))w=DEFAULT_WIDGETS.map(x=>[...x]);
  return S.widgets=w;
}
function renderWidgets(){
  let out="",small=[];
  const flush=()=>{if(small.length){out+=`<div class="tiles">${small.join("")}</div>`;small=[]}};
  for(const [k,on] of widgetList()){if(!on)continue;const w=WIDGETS[k];if(w.size==="s")small.push(w.r());else{flush();out+=w.r()}}
  flush();
  return out||`<div class="empty">Alle Widgets sind ausgeblendet.</div>`;
}
function widgetSheet(){
  const list=widgetList();
  openSheet(sheetHead("Widgets anpassen")+`<p class="small muted" style="margin-bottom:10px">Ein- und ausschalten und mit den Pfeilen sortieren. Kleine Widgets stehen nebeneinander.</p>
  <div class="card" style="padding-block:4px">${list.map(([k,on],i)=>`<div class="alarm${on?"":" off"}"><div class="meta"><b>${WIDGETS[k].n}</b><div class="small muted">${WIDGETS[k].size==="s"?"Klein":"Breit"}</div></div>
   <button class="icon-btn" style="width:34px;height:34px;transform:rotate(90deg)" data-act="wMove" data-i="${i}" data-d="-1" aria-label="Nach oben"${i===0?" disabled":""}>${I.left}</button>
   <button class="icon-btn" style="width:34px;height:34px;transform:rotate(90deg)" data-act="wMove" data-i="${i}" data-d="1" aria-label="Nach unten"${i===list.length-1?" disabled":""}>${I.right}</button>
   <button class="switch" role="switch" aria-checked="${!!on}" aria-label="${WIDGETS[k].n} anzeigen" data-act="wToggle" data-i="${i}"></button></div>`).join("")}</div>
  <button class="btn" style="margin-top:12px;width:100%" data-act="wReset">Standard wiederherstellen</button>`);
}

const V={};

  <header class="top"><div><p class="eyebrow">${longDate(t)}</p><h1>${greet}, ${esc(S.profile.name||"du")}</h1></div>
    <div class="icon-row"><button class="icon-btn" data-act="newEntry" aria-label="Neuer Eintrag">${I.plus}</button><button class="icon-btn" data-act="profile" aria-label="Profil und Einstellungen">${I.gear}</button></div></header>
  ${S.sample?`<div class="notice"><span>Du siehst Beispieldaten, damit du alles ausprobieren kannst.</span><button class="btn" data-act="clearSample">Leer starten</button></div>`:""}

};
V.kalender=()=>{
  const sel=ui.sel,base=ui.month||parseIso(sel);const y=base.getFullYear(),m=base.getMonth();
  const first=new Date(y,m,1),off=(first.getDay()+6)%7,start=addDays(first,-off);
  const weeks=Math.ceil((off+new Date(y,m+1,0).getDate())/7);let cells="";
  for(let i=0;i<weeks*7;i++){const d=addDays(start,i),s=iso(d);
    const types=[...new Set(eventsOn(s).map(e=>e.type))].slice(0,4);
    cells+=`<button class="day${d.getMonth()!==m?" out":""}${s===todayIso()?" today":""}${s===sel?" sel":""}" data-act="pick" data-d="${s}" aria-label="${longDate(s)}"><span>${d.getDate()}</span><span class="dots">${types.map(t=>`<i class="d-${t}"></i>`).join("")}</span></button>`}
  const evs=eventsOn(sel);
  return `<div class="view">
  <header class="top"><div><p class="eyebrow">Kalender</p><h1>${MON[m]} ${y}</h1></div>
   <div class="icon-row"><button class="icon-btn" data-act="month" data-dir="-1" aria-label="Voriger Monat">${I.left}</button><button class="icon-btn" data-act="month" data-dir="1" aria-label="Nächster Monat">${I.right}</button></div></header>
  <div class="card"><div class="grid7">${["Mo","Di","Mi","Do","Fr","Sa","So"].map(w=>`<div class="wd">${w}</div>`).join("")}${cells}</div></div>
  <section class="sec"><div class="sec-h"><h2>${relDate(sel)}</h2><button class="link" data-act="newEntry" data-d="${sel}">+ Eintrag</button></div>
   <div class="list">${evs.length?evs.map(itemRow).join(""):`<div class="empty">Nichts geplant. Tippe auf „+ Eintrag“.</div>`}</div></section>
  <p class="small muted">Farben: <span class="badge" style="--c:var(--c-termin)">Termin</span> <span class="badge" style="--c:var(--c-aufgabe)">Aufgabe</span> <span class="badge" style="--c:var(--c-gym)">Training</span> <span class="badge" style="--c:var(--c-essen)">Mahlzeit</span></p>
  </div>`;
};
V.gym=()=>{
  const now=new Date(),mon=addDays(now,-((now.getDay()+6)%7)),monI=iso(mon),sunI=iso(addDays(mon,6));
  const doneWeek=S.logs.filter(l=>l.date>=monI&&l.date<=sunI).length;
  const planned=upcoming(7,monI).filter(e=>e.type==="gym").length;
  const next=upcoming(21).find(e=>e.type==="gym"&&!e.done);
  const series={};
  for(const l of S.logs)for(const x of l.ex){const w=Math.max(...x.sets.map(s=>s.w));if(w>0)(series[x.n]=series[x.n]||[]).push(w)}
  const prog=Object.entries(series).filter(([,v])=>v.length>=2).sort((a,b)=>b[1].length-a[1].length).slice(0,5);
  const recent=S.logs.slice(-4).reverse();
  return `<div class="view">
  <header class="top"><div><p class="eyebrow">Gym</p><h1>Training</h1></div><button class="icon-btn" data-act="editPlan" aria-label="Neuer Trainingsplan">${I.plus}</button></header>
  ${!S.program?`<div class="notice"><span>Dein Programm ist fertig: erst 2 Wochen zuhause mit Bauch, danach Gym (Ganzkörper 3× oder Oberkörper/Unterkörper 4×). Ziel 2.900 bis 3.150 kcal und 148 g Protein.</span><button class="btn" data-act="programs">Auswählen</button></div>`:""}
  <div class="tiles">
    <div class="tile"><span class="lbl">Diese Woche</span><span class="big num">${doneWeek}<span class="muted" style="font-size:18px"> / ${Math.max(planned,doneWeek)}</span></span><span class="small muted">Einheiten erledigt</span></div>
    <div class="tile"><span class="lbl">Nächstes</span><span class="big" style="font-size:22px">${next?esc(planById(next.plan)?.name||"Training"):"–"}</span><span class="small muted">${next?relDate(next.date)+(next.time?", "+next.time:""):"Nichts geplant"}</span></div>
  </div>
  ${S.program?`<div class="notice" style="background:var(--surface);border-color:var(--line,transparent)"><span>Programm: <b>${esc((PROG_VARIANTS[S.program]||PROG_VARIANTS.gk3).name)}</b>${S.program==="home"&&S.programStart&&iso(addDays(parseIso(S.programStart),14))<=todayIso()?" · 2 Wochen geschafft. Zeit fürs Gym?":""}</span><button class="btn" data-act="programs">Wechseln</button></div>`:""}
  <section class="sec"><h2>Deine Pläne</h2>
   ${S.plans.map(p=>`<div class="card plan"><div class="sec-h"><h3>${esc(p.name)}</h3><button class="link" data-act="editPlan" data-id="${p.id}">Bearbeiten</button></div>
     <p class="ex">${p.ex.map(e=>esc(e.n)+" "+e.s+"×"+e.r+(e.rmax?"–"+e.rmax:"")).join(" · ")}</p>
     <div class="btn-row"><button class="primary" style="background:var(--c-gym)" data-act="start" data-plan="${p.id}">Jetzt starten</button><button class="btn" data-act="newEntry" data-type="gym" data-plan="${p.id}">Einplanen</button></div></div>`).join("")}
  </section>
  <section class="sec"><h2>Fortschritt</h2><div class="card">${prog.length?prog.map(([n,v])=>{const dl=v[v.length-1]-v[0];return `<div class="prog"><div><b>${esc(n)}</b><div class="small muted num">${fmt(v[v.length-1])} kg Top-Satz</div></div>${spark(v)}<span class="delta num">${dl>0?"+":""}${dl.toLocaleString("de-DE")} kg</span></div>`}).join(""):`<p class="muted">Nach zwei Einheiten siehst du hier deine Kurven.</p>`}</div></section>
  <section class="sec"><h2>Rekorde</h2><div class="card">${(()=>{const names=[...new Set(S.logs.flatMap(l=>l.ex.map(x=>x.n)))];
     if(!names.length)return `<p class="muted">Deine Bestleistungen erscheinen hier nach dem ersten Training.</p>`;
     const wk=iso(addDays(new Date(),-7));
     return names.map(n=>({n,b:bestOf(n)})).sort((a,b)=>b.b.w-a.b.w).slice(0,8).map(({n,b})=>`<div class="shop"><span class="nm">${esc(n)}<span class="src">${parseIso(b.date).getDate()}.${parseIso(b.date).getMonth()+1}.${b.date>=wk?' · <b style="color:var(--c-gym)">neu</b>':""}</span></span><span class="num"><b>${b.w?b.w.toLocaleString("de-DE")+" kg":"KG"}</b> × ${b.r}</span></div>`).join("")})()}</div></section>
  <section class="sec"><h2>Zuletzt</h2><div class="list">${recent.length?recent.map(l=>{const vol=l.ex.reduce((a,x)=>a+x.sets.reduce((b,s)=>b+s.w*s.r,0),0);const n=l.ex.reduce((a,x)=>a+x.sets.length,0);
     return `<div class="item t-gym"><div class="time small">${parseIso(l.date).getDate()}.${parseIso(l.date).getMonth()+1}.</div><div class="bar"></div><div class="body"><div class="ttl">${esc(l.name)}</div><div class="sub num">${n} Sätze · ${fmt(vol)} kg bewegt · ${l.min} Min.${l.prs&&l.prs.length?` · <b style="color:var(--c-gym)">${l.prs.length} ${l.prs.length===1?"Rekord":"Rekorde"}</b>`:""}</div></div><span></span></div>`}).join(""):`<div class="empty">Noch keine Einheit gespeichert.</div>`}</div></section>
  </div>`;
};

  ${S.program&&!S.phases?`<div class="notice"><span>Phasenplan: Aufbau bis 16.5.2027 (+550 kcal), dann 10 Wochen Diät bis 25.7., danach Erhalt. Die App stellt Kalorien und Makros automatisch um und erinnert dich.</span><button class="btn" data-act="applyPhases">Übernehmen</button></div>`:""}
  <section class="sec"><h2>Körpergewicht</h2><div class="card">${(()=>{const w=(S.weights||[]).slice().sort((a,b)=>a.date<b.date?-1:1),tr=weightTrend();
    return `${w.length>=2?spark(w.slice(-30).map(z=>z.kg)):""}<p class="small muted num">${w.length?"Zuletzt: "+w[w.length-1].kg.toLocaleString("de-DE")+" kg am "+parseIso(w[w.length-1].date).getDate()+"."+(parseIso(w[w.length-1].date).getMonth()+1)+".":"Wieg dich 2 bis 3 Mal pro Woche morgens nach dem Klo. Die App rechnet den Trend."}${tr&&tr.perWeek!=null?" · Trend "+(tr.perWeek>=0?"+":"")+tr.perWeek.toLocaleString("de-DE",{maximumFractionDigits:2})+" kg/Woche (Ziel +0,3 bis +0,6)":""}</p>

  return `<div class="view">
  <header class="top"><div><p class="eyebrow">Einkauf</p><h1>Einkaufsliste</h1></div></header>
  <form class="add-bar" data-form="shopAdd" autocomplete="off"><input id="shopInput" name="n" placeholder="z. B. 2 Paprika" aria-label="Neuer Artikel"><button class="btn" style="background:var(--accent);color:var(--on-accent);border:0">Hinzufügen</button></form>

  </div>`;
};

/* ---------- render ---------- */
const main=document.getElementById("main");
function render(keepScroll){
  const y=main.scrollTop;
  main.innerHTML=V[ui.view]();

  const recent=[];for(let k=S.meals.length-1;k>=0&&recent.length<5;k--){const m=S.meals[k];if(m.food&&!recent.includes(m.food))recent.push(m.food)}

/* ---------- workout session ---------- */
const sessEl=document.getElementById("session");
// Doppelte Progression: alle Sätze am oberen Ende der Spanne -> Gewicht hoch
function progUp(e,last){if(!e.rmax||!last||last.length<e.s)return 0;if(!last.every(z=>z.r>=e.rmax))return 0;return (last[0].w>0)?(e.inc||2.5):0}
function startSession(planId,evId){
  const p=planById(planId);if(!p)return;
  S.session={planId,evId:evId||null,start:Date.now(),ex:p.ex.map(e=>{const last=lastSets(e.n),up=progUp(e,last);return{n:e.n,r:e.r,rmax:e.rmax,up,sets:Array.from({length:e.s},(_,i)=>({w:(last&&last[i]?last[i].w:last&&last.length?last[last.length-1].w:e.w)+(up&&(last&&last.length?last[0].w:e.w)>0?up:0),r:e.r,ok:false}))}})};
  save();renderSession();
}
function renderSession(){
  const s=S.session;if(!s){sessEl.hidden=true;return}
  const p=planById(s.planId);sessEl.hidden=false;
  sessEl.innerHTML=`<div class="s-head"><div><p class="eyebrow">Training läuft · <span id="elapsed" class="num"></span></p><h2>${esc(p?p.name:"Training")}</h2></div>
   <div class="icon-row"><button class="btn" data-act="cancelSession" data-confirm>Abbrechen</button><button class="btn" style="background:var(--c-gym);color:#fff;border:0" data-act="finishSession">Fertig</button></div></div>
   <div class="s-body">${s.ex.map((x,xi)=>{const last=lastSets(x.n);return `<div class="card"><div class="sec-h"><h3>${esc(x.n)}</h3></div>
     <p class="small muted" style="margin:2px 0 10px">${x.rmax?"Ziel: "+x.r+"–"+x.rmax+" Wdh. · ":""}${last?"Letztes Mal: "+last.map(z=>z.r+"×"+(z.w?z.w.toLocaleString("de-DE")+" kg":"KG")).join(", "):"Erstes Mal: wähle ein Gewicht, das sich sauber schaffen lässt."}${x.up?` · <b style="color:var(--c-gym)">+${x.up.toLocaleString("de-DE")} kg, weil du letztes Mal überall ${x.rmax} geschafft hast</b>`:x.rmax&&last&&last.length&&!last[0].w&&last.every(z=>z.r>=x.rmax)?` · <b style="color:var(--c-gym)">Top. Mach es schwerer (langsamer, Rucksack)</b>`:""}</p>
     <div class="sets"><span class="h">Satz</span><span class="h">kg</span><span class="h">Wdh.</span><span></span>
     ${x.sets.map((z,si)=>`<span class="num"><b>${si+1}</b></span><input type="number" inputmode="decimal" step="0.5" value="${z.w}" data-ex="${xi}" data-set="${si}" data-f="w" aria-label="Gewicht Satz ${si+1}"><input type="number" inputmode="numeric" value="${z.r}" data-ex="${xi}" data-set="${si}" data-f="r" aria-label="Wiederholungen Satz ${si+1}"><button class="chk${z.ok?" on":""}" data-act="setDone" data-ex="${xi}" data-set="${si}" aria-label="Satz erledigt">${I.check}</button>`).join("")}</div>
     <button class="link" data-act="addSet" data-ex="${xi}">+ Satz</button></div>`}).join("")}</div>
   <div class="rest" id="restBar" hidden><b id="restT">1:30</b><button data-act="rest30">+30 s</button><button data-act="restSkip">Weiter</button></div>`;
  tick();
}
sessEl.addEventListener("input",ev=>{const t=ev.target;if(!t.dataset.f||!S.session)return;const v=parseFloat(String(t.value).replace(",","."));S.session.ex[+t.dataset.ex].sets[+t.dataset.set][t.dataset.f]=isNaN(v)?0:v;save()});
function finishSession(){
  const s=S.session;const p=planById(s.planId);
  const ex=s.ex.map(x=>({n:x.n,sets:x.sets.filter(z=>z.ok).map(z=>({w:+z.w||0,r:+z.r||0}))})).filter(x=>x.sets.length);
  if(!ex.length){toast("Hake mindestens einen Satz ab, bevor du speicherst.");return}
  const min=Math.max(1,Math.round((Date.now()-s.start)/60000));
  const prs=[];
  for(const x of ex){const prev=bestOf(x.n);const w=Math.max(...x.sets.map(z=>z.w));
    if(prev&&w>0&&w>prev.w)prs.push(x.n+" "+w.toLocaleString("de-DE")+" kg");
    else if(prev&&w===0&&prev.w===0){const r=Math.max(...x.sets.map(z=>z.r));if(r>prev.r)prs.push(x.n+" "+r+" Wdh.")}}
  S.logs.push({id:uid(),date:todayIso(),planId:s.planId,name:p?p.name:"Training",min,ex,prs});
  // remember new working weights in plan
  if(p)for(const e of p.ex){const x=ex.find(y=>y.n===e.n);if(x)e.w=Math.max(...x.sets.map(z=>z.w))}
  const ev=s.evId?findEv(s.evId):eventsOn(todayIso()).find(e=>e.type==="gym"&&e.plan===s.planId&&!e.done);
  if(ev)setDone(ev.id,true);
  const vol=ex.reduce((a,x)=>a+x.sets.reduce((b,z)=>b+z.w*z.r,0),0),n=ex.reduce((a,x)=>a+x.sets.length,0);
  S.session=null;ui.rest=null;commit();renderSession();
  toast(prs.length?`Neuer Rekord: ${prs.join(", ")}!`:`Gespeichert: ${n} ${n===1?"Satz":"Sätze"}, ${fmt(vol)} kg bewegt. Jetzt Protein!`);
}

let actx=null,beepT=null;
function unlockAudio(){try{if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(A)actx=new A()}if(actx&&actx.state==="suspended")actx.resume()}catch(e){}}
function beep(){if(!actx)return;try{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.type="square";g.gain.setValueAtTime(.0001,actx.currentTime);g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.45);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.5)}catch(e){}}
const ringEl=document.getElementById("ring");
function ringNow(label){
  ringEl.innerHTML=`<p class="eyebrow" style="color:inherit">Wecker</p><div class="t">${nowHM()}</div><h2>${esc(label)}</h2><button class="solid" data-act="ringOff">Ausschalten</button><button data-act="snooze">Schlummern, 5 Min.</button>`;
  ringEl.hidden=false;clearInterval(beepT);beep();beepT=setInterval(beep,1200);
  if(navigator.vibrate)try{navigator.vibrate([400,200,400])}catch(e){}
}
function checkTimers(){
  const now=new Date(),hm=nowHM(),t=todayIso(),key=t+" "+hm;S.fired=S.fired||{};
  for(const a of S.alarms){if(a.on&&a.days.includes(now.getDay())&&a.time===hm&&S.fired[a.id]!==key){S.fired[a.id]=key;save();ringNow(a.label||"Wecker")}}
  if(S.snooze&&Date.now()>=S.snooze.at){const l=S.snooze.label;S.snooze=null;save();ringNow(l)}
  for(const e of eventsOn(t)){if(!e.reminder||!e.time||e.done)continue;
    const [h,m]=e.time.split(":").map(Number);const at=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m-e.reminder);
    if(pad(at.getHours())+":"+pad(at.getMinutes())===hm&&S.fired[e.id]!==key){S.fired[e.id]=key;save();beep();toast(`In ${e.reminder} Min.: ${evTitle(e)}`)}}
}
function tick(){
  if(S.session){const el=document.getElementById("elapsed");if(el){const s=Math.floor((Date.now()-S.session.start)/1000);el.textContent=Math.floor(s/60)+":"+pad(s%60)}}
  const rb=document.getElementById("restBar");
  if(rb){if(ui.rest){const left=Math.ceil((ui.rest-Date.now())/1000);if(left<=0){ui.rest=null;rb.hidden=true;beep();if(navigator.vibrate)try{navigator.vibrate(300)}catch(e){}}else{rb.hidden=false;document.getElementById("restT").textContent="Pause "+Math.floor(left/60)+":"+pad(left%60)}}else rb.hidden=true}
}

/* Kalender-Abo: echte iOS-Mitteilungen auch bei geschlossener App (iPhone-Kalender liest das Gist) */
function icsFeed(){
  const tx=s=>String(s).replace(/\\/g,"\\\\").replace(/[,;]/g,m=>"\\"+m).replace(/\r?\n/g,"\\n");
  const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",dt=(d,t)=>d.replace(/-/g,"")+"T"+t.replace(":","")+"00";
  const end=(d,t,min)=>{const [h,m]=t.split(":").map(Number);const x=new Date(parseIso(d));x.setHours(h,m+min);return iso(x).replace(/-/g,"")+"T"+pad(x.getHours())+pad(x.getMinutes())+"00"};
  const al=(trig,txt)=>["BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+tx(txt),"TRIGGER:"+trig,"END:VALARM"];
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Lifeplanner//DE","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Lifeplanner","REFRESH-INTERVAL;VALUE=DURATION:PT1H","X-PUBLISHED-TTL:PT1H"];
  for(const e of upcoming(60)){if(!e.time||e.done)continue;const title=evTitle(e);
    L.push("BEGIN:VEVENT","UID:"+String(e.id).replace(/[^\w@.-]/g,"")+"@lifeplanner","DTSTAMP:"+stamp,"DTSTART:"+dt(e.date,e.time),"DTEND:"+end(e.date,e.time,e.type==="gym"?75:e.type==="termin"?60:30),"SUMMARY:"+tx(title),
      ...(e.reminder>0?al("-PT"+e.reminder+"M",title):e.ph||e.type==="essen"||e.type==="aufgabe"?al("PT0M",title):[]),"END:VEVENT")}
  const BD=["SU","MO","TU","WE","TH","FR","SA"],t=todayIso();
  for(const a of S.alarms){if(!a.on||!a.days.length)continue;
    L.push("BEGIN:VEVENT","UID:alarm-"+a.id+"@lifeplanner","DTSTAMP:"+stamp,"DTSTART:"+dt(t,a.time),"DTEND:"+end(t,a.time,5),"RRULE:FREQ=WEEKLY;BYDAY="+a.days.map(d=>BD[d]).join(","),"SUMMARY:"+tx("⏰ "+(a.label||"Wecker")),...al("PT0M",a.label||"Wecker"),"END:VEVENT")}
  for(const ph of S.phases||[]){if(ph.from<=t)continue;const d=ph.from.replace(/-/g,""),nd=iso(addDays(parseIso(ph.from),1)).replace(/-/g,"");
    L.push("BEGIN:VEVENT","UID:phase-"+ph.id+"@lifeplanner","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+d,"DTEND;VALUE=DATE:"+nd,"SUMMARY:"+tx("Neue Phase: "+ph.name),"DESCRIPTION:"+tx("Lifeplanner stellt Kalorien und Makros heute automatisch um."),
      ...al("-P6DT15H","In einer Woche startet: "+ph.name),...al("PT9H","Ab heute: "+ph.name),"END:VEVENT")}
  L.push("END:VCALENDAR");
  return L.map(l=>{let o="",u=l;while(u.length>73){o+=u.slice(0,73)+"\r\n ";u=u.slice(73)}return o+u}).join("\r\n");
}
let syncT=null;
function queueSync(){if(!S.sync||!S.sync.token||inFrame)return;clearTimeout(syncT);syncT=setTimeout(pushSync,3000)}
async function pushSync(manual){
  const sy=S.sync;if(!sy||!sy.token)return false;
  const body={description:"Lifeplanner Widget-Daten",files:{"lifeplanner-widget.json":{content:JSON.stringify(widgetSummary())},"lifeplanner.ics":{content:icsFeed()}}};
  try{
    const r=await fetch("https://api.github.com/gists"+(sy.gistId?"/"+sy.gistId:""),{method:sy.gistId?"PATCH":"POST",
      headers:{"Authorization":"Bearer "+sy.token,"Accept":"application/vnd.github+json","Content-Type":"application/json"},
      body:JSON.stringify(sy.gistId?body:{...body,public:false})});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    if(!sy.gistId){sy.gistId=j.id;sy.owner=j.owner&&j.owner.login;}
    sy.last=new Date().toISOString();sy.err="";
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    if(manual)toast("Widget-Daten aktualisiert");
    return true;
  }catch(e){sy.err=String(e.message||e);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){}if(manual)toast(sy.err==="401"?"Der Token stimmt nicht.":"Sync fehlgeschlagen. Bist du online?");return false}
}

const widgetUrl=()=>S.sync&&S.sync.gistId&&S.sync.owner?`https://gist.githubusercontent.com/${S.sync.owner}/${S.sync.gistId}/raw/lifeplanner-widget.json`:"";

/* ---------- ics (only outside the preview frame) ---------- */
function icsFor(e){
  const dt=e.date.replace(/-/g,"")+"T"+e.time.replace(":","")+"00";
  const dur=e.type==="gym"?90:60;const [h,m]=e.time.split(":").map(Number);const end=new Date(parseIso(e.date));end.setHours(h,m+dur);
  const de=iso(end).replace(/-/g,"")+"T"+pad(end.getHours())+pad(end.getMinutes())+"00";
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Lifeplanner//DE","BEGIN:VEVENT","UID:"+e.id+"@lifeplanner","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z","DTSTART:"+dt,"DTEND:"+de,"SUMMARY:"+evTitle(e).replace(/[,;]/g," "),
    ...(e.reminder?["BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+evTitle(e).replace(/[,;]/g," "),"TRIGGER:-PT"+e.reminder+"M","END:VALARM"]:[]),"END:VEVENT","END:VCALENDAR"].join("\r\n");
}

const F={

    const data={type,rep:fd.get("rep")||"",date:fd.get("date")||todayIso(),time:fd.get("time")||"",reminder:+fd.get("reminder")||0,
      title:type==="termin"||type==="aufgabe"?String(fd.get("title")).trim():"",plan:type==="gym"?fd.get("plan"):undefined,recipe:type==="essen"?fd.get("recipe"):undefined};

    const old=id=>{const p=planById(fd.get("id"));return p?p.ex:[]};
    for(const l of lines){const m=l.match(/^(.*?)\s+(\d+)\s*[x×]\s*(\d+)(?:\s*[-–]\s*(\d+))?(?:\s+(\d+(?:[.,]\d+)?))?\s*(?:kg)?$/i);

      ex.push(m?{n:m[1],s:+m[2],r:+m[3],rmax:m[4]?+m[4]:undefined,w:m[5]?parseFloat(m[5].replace(",",".")):0,inc:o&&o.inc}:{n:l,s:3,r:10,w:0})}
    if(!ex.length){toast("Bitte mindestens eine Übung eintragen.");return}
    const id=fd.get("id"),name=String(fd.get("name")).trim()||"Neuer Plan";
    if(id)Object.assign(planById(id),{name,ex});else S.plans.push({id:uid(),name,ex});
    closeSheet();commit();toast("Plan gespeichert");
  },
  alarm:fd=>{
    const days=fd.getAll("d").map(Number);if(!days.length){toast("Wähle mindestens einen Tag.");return}
    S.alarms.push({id:uid(),time:fd.get("time"),label:String(fd.get("label")).trim()||"Wecker",days,on:true});
    S.alarms.sort((a,b)=>a.time<b.time?-1:1);save();alarmSheet();render(true);toast("Wecker gestellt");
  },
  weight:(fd,f)=>{
    const kg=parseFloat(String(fd.get("kg")).replace(",","."));if(!(kg>30&&kg<300)){toast("Bitte ein Gewicht in kg eingeben.");return}
    S.weights=(S.weights||[]).filter(z=>z.date!==todayIso());S.weights.push({date:todayIso(),kg});S.profile.weight=kg;commit();toast("Gewicht gespeichert. Ziele angepasst.");
  },
  profile:fd=>{
    const p=S.profile;const num=k=>{const v=String(fd.get(k)??"").replace(",",".").trim();return v===""?null:+v};p.surplus=num("surplus");p.pkg=num("pkg");p.name=String(fd.get("name")).trim()||"du";p.weight=+fd.get("weight")||p.weight;p.height=+fd.get("height")||p.height;
    p.age=+fd.get("age")||p.age;p.sex=fd.get("sex");p.goal=fd.get("goal");p.act=+fd.get("act");p.example=false;
    closeSheet();commit();toast("Profil gespeichert. Ziele neu berechnet.");
  }
};
document.addEventListener("submit",ev=>{ev.preventDefault();const f=ev.target,fn=F[f.dataset.form];if(fn)fn(new FormData(f),f)});

/* ---------- boot ---------- */
if(S.phases&&(S.phasesVer||1)<PHASES_VER){applyPhases();if(S.profile.surplus==null||S.profile.surplus===400)S.profile.surplus=550;save()}
const h=(location.hash||"").slice(1);
if(V[h])ui.view=h;
window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(V[v]&&v!==ui.view){ui.view=v;render()}});
render();renderSession();checkTimers();
})();
</script>
